<!doctype html><html lang="ja"><head><meta charset="utf-8">
<title>前線（アクション戦闘）</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="battle/battle.css?v=1793620000">
</head><body>
<!-- 横画面の旧版は index_land.html。戦闘の中身は battle/*.js（上から順に読み込む） -->
<div class="wrap" id="wrap">
  <div id="stage">
    <div id="top"><div id="hud">
      <img class="face" src="battle/ui/p/face_tmp.webp" alt="">
      <div class="hp"><i id="hpI"></i><span id="hpT">HP</span></div>
      <div class="ul" id="ulW"><i id="ulI"></i></div>
      <img class="frame" src="battle/ui/p/hudframe.webp" alt="">
      <div class="info"><span id="hWave"><img src="battle/ui/p/sq_sword.webp" alt="">戦場 <b>1 / 3</b></span><i class="sep"></i><span><img src="battle/ui/p/sq_helm.webp" alt="">残り <b id="hLeft">0</b></span><i class="sep"></i><span><img src="battle/ui/p/sq_bag.webp" alt="">物資 <b id="hSup">0</b></span></div>
      <button id="pz" type="button" aria-label="一時停止"><img src="battle/ui/p/pause.webp" alt=""></button>
      <img class="rule" src="battle/ui/p/rule.webp" alt="">
    </div></div>
    <div id="field"><canvas id="game" tabindex="0" aria-label="ゲーム画面"></canvas>
      <div id="ov"><div class="card"><div class="t1"></div><h2></h2><p class="s1"></p><p class="s2"></p><div class="row"></div></div></div>
      <p class="note" id="loadnote">素材を読み込み中です。</p>
    </div>
    <button id="fs" type="button" hidden>全画面</button>
    <!-- 操作盤：背景は描かない（キャンバスの床が後ろまで続く）。部品は battle/ui/p/（battle/tools/slice_ui.py で切り出し） -->
    <div id="ctl"><div class="touch">
      <i class="shade"></i><img class="ground" src="battle/ui/p/ground.webp" alt="">
      <div id="war"><img class="gf" src="battle/ui/p/gaugeframe.webp" alt=""><span class="l">自軍優勢</span><span class="r">敵軍優勢</span><div id="gauge"><i id="gI"></i></div><img id="gdia" src="battle/ui/p/gaugedia.webp" alt=""></div>
      <div id="pad" aria-label="移動パッド"><img class="ring" src="battle/ui/p/padring.webp" alt=""><div id="knob"></div></div>
      <button class="btn s" id="btnP" type="button"><img src="battle/ui/p/ic_pull.webp" alt=""><span class="lbl">吸引</span></button>
      <button class="btn s" id="btnS" type="button"><img src="battle/ui/p/ic_shock.webp" alt=""><span class="lbl">衝撃波</span></button>
      <button class="btn s" id="btnT" type="button"><img src="battle/ui/p/ic_thr.webp" alt=""><span class="lbl">突き</span></button>
      <button class="btn s" id="btnD" type="button"><img src="battle/ui/p/ic_dodge.webp" alt=""><span class="lbl">回避</span></button>
      <button class="btn s" id="btnU" type="button"><img src="battle/ui/p/ic_ult.webp" alt=""><span class="lbl">必殺</span></button>
      <button class="btn s c" id="btnC" type="button"><img src="ally/por_mina_1.png" alt="" id="btnCi"><span class="lbl">連携</span></button>
      <button class="btn a" id="btnA" type="button"><img src="battle/ui/p/ic_atk.webp" alt=""><span class="lbl">攻撃</span></button>
    </div></div>
  </div>
  <div class="keys" id="keys"></div>
</div>

<script src="battle/core.js?v=1793700000"></script>
<script src="battle/input.js?v=1793356424"></script>
<script src="battle/play.js?v=1793356424"></script>
<script src="battle/update.js?v=1793356424"></script>
<script src="battle/draw.js?v=1793356424"></script>
<script src="battle/fx.js?v=1793356424"></script>
<script src="battle/fx2.js?v=1793356424"></script>
<script src="battle/ally.js?v=1793690000"></script>
<script src="battle/ui.js?v=1793356424"></script>
<script src="battle/loop.js?v=1793356424"></script>


</body></html>
