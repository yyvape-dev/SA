<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>月夜の回廊 試作</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 一画面のアリーナ。暗い石の回廊に合わせた単一の見た目（ライト/ダークの切り替えは行わない）。 */
:root {
  --bg: #0c0a11;
  --panel: #17131f;
  --fg: #ece6f2;
  --muted: #9d93ab;
  --line: #2e2638;
  --accent: #ffb347;
  --font: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font);
  font-size: 14px; line-height: 1.6;
  padding-block: 12px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: none; margin: 0 auto; display: grid; gap: 8px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
.head h1 { margin: 0; font-size: 17px; font-weight: 900; letter-spacing: .04em; }
.head p { margin: 0; color: var(--muted); font-size: 12.5px; }
#stage { position: relative; width: 100%; max-width: calc((100vh - 96px) * 16 / 9); margin: 0 auto; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; touch-action: none; }
#game { display: block; width: 100%; height: 100%; outline: none; object-fit: contain; }
#stage:fullscreen { max-width: none; width: 100vw; height: 100vh; aspect-ratio: auto; border: 0; border-radius: 0; }
#fs { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); z-index: 3; font: inherit; font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 6px; border: 1px solid var(--line); background: rgba(12,10,17,.7); color: var(--fg); cursor: pointer; }
.keys { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12.5px; }
.keys b { color: var(--fg); font-weight: 700; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; margin-right: 4px; }
.touch { display: none; position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px; justify-content: space-between; align-items: flex-end; pointer-events: none; touch-action: none; user-select: none; -webkit-user-select: none; z-index: 2; }
@media (pointer: coarse) { .touch { display: flex; } .keys { display: none; } }
@media (pointer: coarse) and (orientation: landscape) { .head, .note { display: none; } #stage { max-width: calc((100vh - 16px) * 16 / 9); } body { padding-block: 8px; } }
#pad { width: 22%; max-width: 170px; aspect-ratio: 1; border-radius: 50%; background: rgba(23,19,31,.55); border: 2px solid rgba(255,255,255,.25); position: relative; flex: 0 0 auto; pointer-events: auto; }
#knob { position: absolute; width: 38%; height: 38%; border-radius: 50%; background: var(--accent); opacity: .8; left: 31%; top: 31%; pointer-events: none; }
.btns { display: flex; gap: 14px; align-items: center; }
.btn { font: inherit; font-weight: 900; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); background: rgba(23,19,31,.6); color: var(--fg); touch-action: none; pointer-events: auto; }
.btn.a { width: min(18vw, 120px); height: min(18vw, 120px); font-size: 20px; background: rgba(58,42,20,.75); border-color: var(--accent); }
.btn.s { width: min(13vw, 88px); height: min(13vw, 88px); font-size: 14px; }
.btn.u { border-color: #ff8a8a; background: rgba(70,24,30,.75); }
.btn:active { filter: brightness(1.4); }
.note { color: var(--muted); font-size: 12px; margin: 0; }
</style>

<div class="wrap">
  <div class="head">
    <h1>月夜の回廊 試作</h1>
    <p>敵の群れをスキルで一掃する爽快感を試す、最小の遊べる版です。敵は仮の絵です。</p>
  </div>
  <div id="stage">
    <canvas id="game" tabindex="0" aria-label="ゲーム画面"></canvas>
    <button id="fs" type="button">全画面</button>
    <div class="touch">
      <div id="pad" aria-label="移動パッド"><div id="knob"></div></div>
      <div class="btns">
        <button class="btn s u" id="btnU" type="button">必殺</button>
        <button class="btn s" id="btnP" type="button">吸引</button>
        <button class="btn s" id="btnS" type="button">衝撃波</button>
        <button class="btn a" id="btnA" type="button">攻撃</button>
      </div>
    </div>
  </div>
  <div class="keys">
    <span><b>← ↑ ↓ →</b>移動（WASDも可）</span>
    <span><b>Shift</b>走る</span>
    <span><b>J / Space</b>攻撃</span>
    <span><b>L</b>吸引（敵を引き寄せて拘束）</span>
    <span><b>U</b>必殺技（回転斬り・周囲一掃）</span>
    <span><b>K</b>衝撃波</span>
    <span><b>1 2 3</b>強化を選ぶ</span>
    <span><b>R</b>やり直す</span>
  </div>
  <p class="note" id="loadnote">素材を読み込み中です。</p>
</div>

<script>
(function () {
  'use strict';
  var W = 1280, H = 720;
  var cv = document.getElementById('game'), ctx = cv.getContext('2d');
  cv.width = W; cv.height = H;
  var RES = 1, resTick = 0;
  function fitRes() { // 画面に映る実際の大きさに合わせて内部解像度を上げる（最大2倍）。論理座標は1280×720のまま
    var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    var want = Math.max(1, Math.min(2, Math.round((r.width * dpr / W) * 4) / 4));
    if (!(r.width > 0)) want = RES;
    if (want !== RES || cv.width !== Math.round(W * want)) { RES = want; cv.width = Math.round(W * RES); cv.height = Math.round(H * RES); }
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  }

  /* ---------- 素材 ---------- */
  var RUN_K = 0.86; // 走りの動画はキャラが約1.15倍の大きさで出たため、足元を基準に縮める
  var M = { ax: 362, ay: 379, k: 0.6, clips: { walk: 24, run: 10, atk: 19, rec: 17, idle: 1, ult: 59 } }; // 待機・歩き・走りは1.0倍で保存。0.6倍で描くと従来と同じ大きさ
  var ATK_A = { ax: 235.2, ay: 328.2, k: 1 }; // 攻撃・構え直しは旧素材（0.6倍で保存）。攻撃の動画を撮り直したら置き換える
  var ULT_A = { ax: 446, ay: 568, k: 0.6 }, ULT_F0 = 8; // 必殺技の連番は、動画のコマ8〜66。足元の基準は主人公と同じ高さ
  var IMG = {}, loaded = 0, total = 1, failed = 0, started = false;
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function onDone() { loaded++; if (loaded >= total) boot(); }
  function loadAll() {
    var names = [];
    Object.keys(M.clips).forEach(function (c) { for (var i = 0; i < M.clips[c]; i++) names.push(c + '_' + pad2(i)); });
    total = names.length + 1;
    var bg = new Image(); bg.onload = onDone; bg.onerror = function () { failed++; onDone(); }; bg.src = 'bg.jpg'; IMG.bg = bg;
    names.forEach(function (n) {
      var im = new Image(); im.onload = onDone; im.onerror = function () { failed++; onDone(); };
      im.src = 'sprites/' + n + '.png'; IMG[n] = im;
    });
  }

  /* ---------- 定数と状態 ---------- */
  var LANE_Y0 = 528, LANE_Y1 = 590;
  function depthScale(y) { return 0.9 + 0.16 * ((y - LANE_Y0) / (LANE_Y1 - LANE_Y0)); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rnd(a, b) { return a + Math.random() * (b - a); }

  var keys = {}, pad = { x: 0, y: 0, mag: 0 };
  var G, S;

  function newGame() {
    S = { dmg: 1, range: 1, aspd: 1, cd: 1, chain: 0, pcd: 1, bind: 0.8 };
    G = {
      state: 'title', t: 0, wave: 0, enemies: [], drops: [], parts: [], fx: [], texts: [], booms: [],
      queue: [], qT: 0, shake: 0, freeze: 0, combo: 0, comboT: 0, bestCombo: 0, kills: 0, gold: 0, rare: 0,
      skCD: 0, skMax: 3.2, pullCD: 0, pullMax: 6, ultCD: 0, ultMax: 14, flash: 0, picks: [], pickOpts: [], upgraded: [],
      hero: { x: 340, y: 560, face: 1, hp: 120, max: 120, state: 'idle', t: 0, anim: 0, sk: false, kind: 'atk', fxT: 0, ringT: 0, h1: false, h2: false, buf: 0, cancelT: 0, total: 0, inv: 0, flash: 0 }
    };
  }

  /* ---------- 入力 ---------- */
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
    if (!keys[e.code]) onPress(e.code);
    keys[e.code] = true;
  });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });
  window.addEventListener('blur', function () { keys = {}; });

  function onPress(code) {
    if (!started) return;
    if (G.state === 'title') { startRun(); return; }
    if (G.state === 'dead') { if (code === 'KeyR' || code === 'Space' || code === 'Enter') { newGame(); startRun(); } return; }
    if (G.state === 'pick') {
      if (code === 'Digit1' || code === 'Numpad1') choose(0);
      if (code === 'Digit2' || code === 'Numpad2') choose(1);
      if (code === 'Digit3' || code === 'Numpad3') choose(2);
      return;
    }
    if (code === 'KeyR') { newGame(); startRun(); return; }
    if (code === 'KeyJ' || code === 'Space' || code === 'KeyZ') tryAttack('atk');
    if (code === 'KeyK' || code === 'KeyX') tryAttack('sk');
    if (code === 'KeyL' || code === 'KeyC') tryAttack('pull');
    if (code === 'KeyU' || code === 'KeyV') tryAttack('ult');
  }

  function canvasPoint(ev) {
    var r = cv.getBoundingClientRect(), k = Math.min(r.width / W, r.height / H);
    var ox = (r.width - W * k) / 2, oy = (r.height - H * k) / 2;
    return { x: (ev.clientX - r.left - ox) / k, y: (ev.clientY - r.top - oy) / k };
  }
  cv.addEventListener('pointerdown', function (ev) {
    cv.focus();
    if (!started) return;
    var p = canvasPoint(ev);
    if (G.state === 'title') { startRun(); return; }
    if (G.state === 'dead') { newGame(); startRun(); return; }
    if (G.state === 'pick') {
      for (var i = 0; i < 3; i++) {
        var cx = 190 + i * 290;
        if (p.x >= cx && p.x <= cx + 270 && p.y >= 210 && p.y <= 520) { choose(i); return; }
      }
    }
  });

  var padEl = document.getElementById('pad'), knob = document.getElementById('knob'), padId = null;
  function padMove(ev) {
    var r = padEl.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2, R = r.width / 2 - 10;
    var dx = ev.clientX - cx, dy = ev.clientY - cy, d = Math.hypot(dx, dy) || 1;
    var k = Math.min(1, d / R);
    pad.x = dx / d * k; pad.y = dy / d * k; pad.mag = k;
    knob.style.transform = 'translate(' + (pad.x * R * 0.55) + 'px,' + (pad.y * R * 0.55) + 'px)';
  }
  padEl.addEventListener('pointerdown', function (ev) { padId = ev.pointerId; padEl.setPointerCapture(ev.pointerId); padMove(ev); });
  padEl.addEventListener('pointermove', function (ev) { if (ev.pointerId === padId) padMove(ev); });
  function padEnd(ev) { if (ev.pointerId !== padId) return; padId = null; pad.x = pad.y = pad.mag = 0; knob.style.transform = ''; }
  padEl.addEventListener('pointerup', padEnd); padEl.addEventListener('pointercancel', padEnd);
  function tapBtn(id, fn) {
    document.getElementById(id).addEventListener('pointerdown', function (ev) {
      ev.preventDefault();
      if (!started) return;
      if (G.state === 'title') { startRun(); return; }
      if (G.state === 'dead') { newGame(); startRun(); return; }
      fn();
    });
  }
  tapBtn('btnA', function () { tryAttack('atk'); });
  tapBtn('btnS', function () { tryAttack('sk'); });
  tapBtn('btnP', function () { tryAttack('pull'); });
  tapBtn('btnU', function () { tryAttack('ult'); });

  /* ---------- 進行 ---------- */
  function startRun() { G.state = 'play'; G.t = 0; startWave(1); }

  function startWave(n) {
    G.wave = n; G.queue = []; G.qT = 0;
    var count = Math.min(70, 10 + n * 6);
    for (var i = 0; i < count; i++) G.queue.push({ at: rnd(0, 5.5), elite: false });
    if (n % 3 === 0) G.queue.push({ at: 4, elite: true });
    G.queue.sort(function (a, b) { return a.at - b.at; });
    addText(W / 2, 250, 'WAVE ' + n, 54, '#ffd27a', 1.6);
  }

  function spawn(q) {
    var side = Math.random() < 0.5 ? -1 : 1, n = G.wave;
    var e = {
      x: side < 0 ? -60 : W + 60, y: rnd(LANE_Y0, LANE_Y1), face: -side,
      size: q.elite ? 1.6 : rnd(0.92, 1.08), elite: q.elite,
      max: (22 + n * 5) * (q.elite ? 10 : 1), hp: 0, sp: (78 + rnd(0, 40) + n * 3) * (q.elite ? 0.8 : 1),
      state: 'walk', t: rnd(0, 6), atkCD: rnd(0.2, 0.8), stun: 0, kx: 0, flash: 0, dt: 0, dmg: 6 + n * (q.elite ? 2 : 1)
    };
    e.hp = e.max; G.enemies.push(e);
  }

  // kind: 'atk'（通常）/ 'sk'（衝撃波）/ 'pull'（吸引）
  function tryAttack(kind) {
    if (G.state !== 'play') return;
    var h = G.hero;
    if (h.state === 'atk' && h.kind === 'ult') return; // 必殺技の最中は、入力を受けない
    if (kind === 'ult' && G.ultCD > 0) { addText(h.x, h.y - 250, '必殺 再使用まで ' + G.ultCD.toFixed(1) + '秒', 20, '#ffb3b3', 0.7); return; }
    if (kind === 'sk' && G.skCD > 0) { addText(h.x, h.y - 250, '再使用まで ' + G.skCD.toFixed(1) + '秒', 20, '#9aa0ff', 0.7); return; }
    if (kind === 'pull' && G.pullCD > 0) { addText(h.x, h.y - 250, '吸引 再使用まで ' + G.pullCD.toFixed(1) + '秒', 20, '#b7a6ff', 0.7); return; }
    if (h.state === 'atk' && h.t < h.cancelT) { h.buf = kind; return; }
    beginAttack(kind);
  }
  function beginAttack(kind) {
    var h = G.hero, a = S.aspd;
    h.state = 'atk'; h.t = 0; h.kind = kind; h.sk = kind === 'sk'; h.h1 = h.h2 = false; h.buf = 0;
    // 吸引は、引いた直後に次の技へつなげられるよう、キャンセル可能になる時点を早める
    h.cancelT = kind === 'pull' ? (10 / 48 + 0.14) / a : (10 / 48 + 9 / 32 + 5 / 48) / a;
    h.total = (10 / 48 + 9 / 32 + 17 / 48) / a;
    if (kind === 'sk') G.skCD = G.skMax * S.cd;
    if (kind === 'pull') G.pullCD = G.pullMax * S.pcd;
    if (kind === 'ult') { h.cancelT = ULT.total; h.total = ULT.total; h.fxT = 0; h.ringT = 0; G.ultCD = G.ultMax; }
  }
  // 必殺技：回転斬り。溜め→一瞬止める→斬る(当たり)→振り抜き→戻り。動画の3秒を、約1.5秒に詰める
  var ULT = { charge: 0.75, tame: 0.15, slash: 0.10, post: 0.22, ret: 0.30 };
  ULT.hit = ULT.charge + ULT.tame + ULT.slash; ULT.total = ULT.hit + ULT.post + ULT.ret;
  function ultFrame(t) {
    var f;
    if (t < ULT.charge) f = 8 + 32 * (t / ULT.charge);
    else if (t < ULT.charge + ULT.tame) f = 40;
    else if (t < ULT.hit) f = 40 + 7 * ((t - ULT.charge - ULT.tame) / ULT.slash);
    else if (t < ULT.hit + ULT.post) f = 47 + 9 * ((t - ULT.hit) / ULT.post);
    else f = 56 + 10 * Math.min(1, (t - ULT.hit - ULT.post) / ULT.ret);
    return Math.max(0, Math.min(58, Math.floor(f) - ULT_F0));
  }
  function ultTick(h, dt) {
    var t = h.t;
    if (t < ULT.hit) { // 溜め：気が集まる。ためている間は、光の粒が増える
      var k = t / ULT.hit;
      h.fxT -= dt;
      if (h.fxT <= 0) {
        h.fxT = 0.04;
        for (var i = 0; i < 2 + Math.floor(k * 3); i++) G.parts.push({ x: h.x + rnd(-80, 80), y: h.y - rnd(0, 230), vx: rnd(-20, 20), vy: -rnd(80, 240), g: 0, life: rnd(0.4, 0.8), t: 0, c: i % 2 ? '#bfe4ff' : '#fff1c4', s: rnd(3, 7) });
      }
      h.ringT -= dt;
      if (h.ringT <= 0) { h.ringT = 0.28; G.fx.push({ type: 'suck', x: h.x, y: h.y, t: 0, life: 0.45, rgb: '150,215,255' }); }
      if (t > ULT.charge) G.shake = Math.max(G.shake, 2.5); // 止めている間の、ためた震え
    }
    if (!h.h1 && t >= ULT.hit) { h.h1 = true; doUlt(h); }
    if (t >= ULT.total) h.state = 'idle';
  }
  // 範囲：左右それぞれ540px（回転斬りなので、背中側も当たる）。吸引で集めておくと、遠い敵も一緒に入る
  function doUlt(h) {
    var R = 540 * S.range, hits = 0, dmg = 150 * S.dmg, i;
    for (i = 0; i < G.enemies.length; i++) {
      var e = G.enemies[i];
      if (e.state !== 'walk' || Math.abs(e.x - h.x) > R) continue;
      hurt(e, dmg * (0.9 + Math.random() * 0.2), e.x >= h.x ? 1 : -1, true); hits++;
    }
    var sf = -h.face; // 動画の振り抜きは、立ち姿の向きと逆へ出る（剣の見える側）
    G.fx.push({ type: 'ultarc', x: h.x, y: h.y, face: sf, t: 0, life: 0.42 });
    G.fx.push({ type: 'ultarc', x: h.x, y: h.y, face: -sf, t: 0, life: 0.34, small: true });
    G.fx.push({ type: 'shock', x: h.x, y: h.y, dir: 1, t: 0, life: 0.6 });
    G.fx.push({ type: 'shock', x: h.x, y: h.y, dir: -1, t: 0, life: 0.6 });
    G.fx.push({ type: 'ring', x: h.x, y: h.y, R: R, t: 0, life: 0.55, rgb: '200,235,255', rgb2: '120,180,255' });
    G.flash = 0.85;
    G.freeze = Math.max(G.freeze, 0.14 + Math.min(hits, 14) * 0.006);
    G.shake = Math.max(G.shake, 22 + Math.min(hits, 14) * 1.2);
    for (i = 0; i < 40; i++) { var dr = i % 2 ? 1 : -1; G.parts.push({ x: h.x + dr * rnd(40, 400), y: h.y - rnd(0, 30), vx: dr * rnd(80, 520), vy: -rnd(120, 520), g: 900, life: rnd(0.4, 0.9), t: 0, c: i % 3 ? '#d9d2bd' : '#ffe9a8', s: rnd(3, 8) }); }
    addText(h.x, h.y - 280, '必殺！', 58, '#ffe9a8', 1.0);
    if (hits) addText(h.x, h.y - 340, hits + '体 撃破', 30, '#ffb3b3', 1.0);
  }
  function atkFrame(t, a) {
    var P = [['atk', 0, 9, 48], ['atk', 10, 18, 32], ['rec', 0, 16, 48]];
    for (var k = 0; k < P.length; k++) {
      var c = P[k][0], f = P[k][1], to = P[k][2], fps = P[k][3], n = to - f + 1, d = n / (fps * a);
      if (t < d) return { c: c, i: f + Math.min(n - 1, Math.floor(t * fps * a)) };
      t -= d;
    }
    return { c: 'rec', i: 16 };
  }

  function addText(x, y, s, size, col, life) { G.texts.push({ x: x, y: y, s: s, size: size, col: col, life: life, t: 0 }); }

  function doHit(n) {
    var h = G.hero, sk = h.sk, hits = 0;
    var R = (sk ? 430 : 340) * S.range, lane = sk ? 160 : 72;
    var dmg = (sk ? 62 : (n === 1 ? 20 : 13)) * S.dmg;
    for (var i = 0; i < G.enemies.length; i++) {
      var e = G.enemies[i];
      if (e.state !== 'walk') continue;
      var dx = (e.x - h.x) * h.face, dy = Math.abs(e.y - h.y), ok;
      if (sk) ok = Math.pow(e.x - h.x, 2) / (R * R) + Math.pow(dy / (R * 0.4), 2) < 1;
      else ok = dx > -50 && dx < R && dy < lane;
      if (ok) { hurt(e, dmg * (0.9 + Math.random() * 0.2), (e.x >= h.x ? 1 : -1) * (sk ? 1 : h.face > 0 ? 1 : -1), sk); hits++; }
    }
    if (sk) G.fx.push({ type: 'ring', x: h.x, y: h.y, R: R, t: 0, life: 0.5 });

  function collect(d) {

        ctx.beginPath(); ctx.ellipse(f.x, f.y, f.R * p, f.R * 0.4 * p, 0, 0, 7); ctx.stroke();
        ctx.fillStyle = 'rgba(' + (f.rgb2 || '255,170,60') + ',' + (0.18 * (1 - p)) + ')'; ctx.beginPath(); ctx.ellipse(f.x, f.y, f.R * p, f.R * 0.4 * p, 0, 0, 7); ctx.fill();
      } else if (f.type === 'suck') { // 一点へ縮む渦
        for (var r = 0; r < 3; r++) {
          var q = (p * 1.5 + r / 3) % 1;
          ctx.strokeStyle = 'rgba(' + (f.rgb || '175,150,255') + ',' + (0.9 * q * (1 - p)) + ')'; ctx.lineWidth = 7 * q + 1;
          ctx.beginPath(); ctx.ellipse(f.x, f.y - 30, 170 * (1 - q) + 8, 70 * (1 - q) + 3, 0, 0, 7); ctx.stroke();
        }
      } else if (f.type === 'pline') { // 引き寄せの軌跡
        ctx.strokeStyle = 'rgba(190,170,255,' + (0.55 * (1 - p)) + ')'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(f.x1, f.y1 - 50); ctx.lineTo(f.x2, f.y2 - 50); ctx.stroke();
      } else if (f.type === 'ultarc') { // 回転斬りの弧：下から前へ、一気に振り上がる
        ctx.save(); ctx.translate(f.x, f.y - 130); ctx.scale(f.face, 1);
        var sw = Math.min(1, p * 2.4), rx = f.small ? 380 : 600, ry = f.small ? 150 : 230, a0 = 1.2, a1 = a0 - 2.6 * sw;
        var fa = 1 - Math.max(0, p - 0.35) / 0.65, wd = (f.small ? 36 : 70) * (1 - p * 0.6); ctx.lineCap = 'round';
        ctx.strokeStyle = 'rgba(120,190,255,' + (0.55 * fa) + ')'; ctx.lineWidth = wd * 1.8; ctx.beginPath(); ctx.ellipse(40, 0, rx, ry, 0, a0, a1, true); ctx.stroke();
        ctx.strokeStyle = 'rgba(190,235,255,' + (0.9 * fa) + ')'; ctx.lineWidth = wd; ctx.beginPath(); ctx.ellipse(40, 0, rx, ry, 0, a0, a1, true); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,' + fa + ')'; ctx.lineWidth = wd * 0.35; ctx.beginPath(); ctx.ellipse(40, 0, rx, ry, 0, a0, a1, true); ctx.stroke();
        ctx.restore();
      } else if (f.type === 'shock') { // 地面を走る衝撃波（前後へ）
        var sx0 = f.x + f.dir * (60 + 760 * p), fa2 = 1 - p;
        ctx.strokeStyle = 'rgba(255,240,205,' + fa2 + ')'; ctx.lineWidth = 14 * fa2 + 2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.ellipse(sx0, f.y - 30, 46, 96, 0, -Math.PI / 2, Math.PI / 2, f.dir < 0); ctx.stroke();
        ctx.strokeStyle = 'rgba(190,225,255,' + (0.5 * fa2) + ')'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(f.x + f.dir * 40, f.y); ctx.lineTo(sx0, f.y); ctx.stroke();
      } else if (f.type === 'boom') {
        ctx.strokeStyle = 'rgba(255,120,60,' + (1 - p) + ')'; ctx.lineWidth = 8 * (1 - p) + 1;
        ctx.beginPath(); ctx.ellipse(f.x, f.y - 30, f.R * p, f.R * 0.5 * p, 0, 0, 7); ctx.stroke();
      }
    }
    for (i = 0; i < G.parts.length; i++) {
      p = G.parts[i]; ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s);
    }
    ctx.restore();
  }

  function drawDrops() {
    for (var i = 0; i < G.drops.length; i++) {
      var d = G.drops[i], col = d.type === 2 ? '#d48cff' : d.type === 1 ? '#7ec8ff' : '#fff2b8', r = d.type === 2 ? 9 : d.type === 1 ? 7 : 5;
      var y = d.y - d.z - 6;
      ctx.save(); ctx.translate(d.x, y);
      ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = col; ctx.globalAlpha = 0.25;
      ctx.beginPath(); ctx.arc(0, 0, r * 2.6, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over'; ctx.rotate(Math.PI / 4 + d.t * 3);
      ctx.fillStyle = col; ctx.fillRect(-r * 0.7, -r * 0.7, r * 1.4, r * 1.4);
      ctx.restore();
    }
  }

  function txt(s, x, y, size, col, align, w) {
    ctx.font = '900 ' + size + 'px "Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif';
    ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
    ctx.lineJoin = 'round'; ctx.lineWidth = w || Math.max(3, size / 6); ctx.strokeStyle = 'rgba(8,6,12,0.9)';
    ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y);
  }

  function drawHud() {
    var h = G.hero, i;
    // HP
    ctx.fillStyle = 'rgba(8,6,12,0.7)'; ctx.fillRect(24, 22, 330, 20);
    ctx.fillStyle = h.hp / h.max > 0.3 ? '#c9344a' : '#ff5a3c'; ctx.fillRect(26, 24, 326 * h.hp / h.max, 16);
    txt('HP ' + Math.ceil(h.hp) + ' / ' + h.max, 30, 38, 15, '#fff', 'left', 3);
    var left = G.enemies.filter(function (e) { return e.state === 'walk'; }).length + G.queue.length;
    txt('WAVE ' + G.wave + '   残り ' + left, 24, 70, 22, '#ffd27a');
    txt('素材 ' + G.gold + '　レア ' + G.rare, W - 28, 40, 22, '#fff2b8', 'right');
    if (G.combo >= 2) {
      var s = 34 + Math.min(G.combo, 40) * 0.9;
      txt(G.combo + ' COMBO', W - 28, 96 + (s - 34) * 0.4, s, '#ff9a5a', 'right');
      ctx.fillStyle = 'rgba(255,154,90,0.85)'; ctx.fillRect(W - 28 - 180 * (G.comboT / 2.4), 108 + (s - 34) * 0.4, 180 * (G.comboT / 2.4), 5);
    }
    // スキル（左：吸引 / 右：衝撃波）
    skillIcon(W / 2 - 92, H - 64, 'L', '吸引', G.pullCD, G.pullMax * S.pcd, '#b7a6ff', '#e6deff');
    skillIcon(W / 2, H - 64, 'K', '衝撃波', G.skCD, G.skMax * S.cd, '#ffcd6e', '#ffe9b8');
    skillIcon(W / 2 + 92, H - 64, 'U', '必殺', G.ultCD, G.ultMax, '#ff8a8a', '#ffd6d6');
  }
  function skillIcon(cx, cy, key, label, cd, max, ring, keyCol) {
    var r = 36, ready = cd <= 0;
    ctx.fillStyle = 'rgba(8,6,12,0.75)'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
    ctx.strokeStyle = ready ? ring : '#5a5066'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
    if (!ready) { ctx.fillStyle = 'rgba(120,100,150,0.45)'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r - 3, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * (cd / max)); ctx.closePath(); ctx.fill(); }
    txt(key, cx, cy + 8, 22, ready ? keyCol : '#8a80a0', 'center', 3);
    txt(label, cx, cy + r + 20, 14, '#cfc6dc', 'center', 3);
  }

  function drawOverlay() {
    var i;
    if (G.state === 'title') {
      ctx.fillStyle = 'rgba(6,4,10,0.62)'; ctx.fillRect(0, 0, W, H);
      txt('月夜の回廊（試作）', W / 2, 250, 64, '#ffd27a', 'center');
      txt('群れを、一振りで薙ぎ払え。', W / 2, 310, 28, '#ece6f2', 'center');
      txt('移動  ←↑↓→ / WASD　　走る  Shift　　攻撃  J / Space', W / 2, 390, 22, '#cfc6dc', 'center');
      txt('吸引（集めて拘束）  L　　衝撃波（一掃）  K　　→  L のあとに K', W / 2, 426, 22, '#c9bcff', 'center');
      txt('必殺  U（回転斬り・周囲一掃）　　吸引 → 必殺 でほぼ全滅', W / 2, 462, 22, '#ffb3b3', 'center');
      txt('スマホは、左の丸いパッドと右のボタン', W / 2, 498, 20, '#9d93ab', 'center');
      txt('クリック、またはキーを押して開始', W / 2, 560, 30, '#fff', 'center');
      return;
    }
    if (G.state === 'pick') {
      ctx.fillStyle = 'rgba(6,4,10,0.7)'; ctx.fillRect(0, 0, W, H);
      txt('WAVE ' + G.wave + ' クリア！ 強化を1つ選ぶ', W / 2, 150, 40, '#ffd27a', 'center');
      for (i = 0; i < 3; i++) {
        var u = UPG[G.pickOpts[i]], cx = 190 + i * 290;
        ctx.fillStyle = 'rgba(30,22,42,0.96)'; ctx.fillRect(cx, 210, 270, 310);
        ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 3; ctx.strokeRect(cx, 210, 270, 310);
        txt(String(i + 1), cx + 22, 262, 40, '#ffb347');
        wrapText(u.name, cx + 135, 320, 236, 26, '#fff', 'center', 3);
        wrapText(u.desc, cx + 135, 440, 230, 17, '#b9b0c8', 'center', 2);
      }
      txt('1 / 2 / 3 キー、またはタップで選ぶ', W / 2, 580, 20, '#9d93ab', 'center');
    }
    if (G.state === 'dead') {
      ctx.fillStyle = 'rgba(30,4,8,0.72)'; ctx.fillRect(0, 0, W, H);
      txt('やられた…', W / 2, 250, 66, '#ff6b6b', 'center');
      txt('到達 WAVE ' + G.wave + '　撃破 ' + G.kills + '　最大コンボ ' + G.bestCombo + '　素材 ' + G.gold, W / 2, 330, 28, '#fff', 'center');
      if (G.upgraded.length) wrapText('強化：' + G.upgraded.join(' / '), W / 2, 390, 900, 18, '#cfc6dc', 'center', 2);
      txt('R キー、またはタップでやり直す', W / 2, 500, 28, '#ffd27a', 'center');
    }
  }

  function wrapText(s, x, y, maxW, size, col, align, lh) {
    ctx.font = '900 ' + size + 'px "Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif';
    var line = '', lines = [];
    for (var i = 0; i < s.length; i++) {
      var t = line + s[i];
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = s[i]; } else line = t;
    }
    lines.push(line);
    for (var k = 0; k < lines.length; k++) txt(lines[k], x, y + k * size * (1 + (lh || 2) * 0.1 + 0.25), size, col, align, 3);
  }

  function draw() {
    if (resTick++ % 30 === 0) fitRes();
    ctx.setTransform(RES, 0, 0, RES, 0, 0);
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    var sx = G.shake ? (Math.random() - 0.5) * G.shake : 0, sy = G.shake ? (Math.random() - 0.5) * G.shake : 0;
    ctx.translate(sx, sy);
    if (IMG.bg && IMG.bg.naturalWidth) ctx.drawImage(IMG.bg, -8, -8, W + 16, H + 16);
    var h0 = G.hero; // 必殺技の溜め中は、背景を暗くして、主人公と敵を目立たせる
    if (G.state === 'play' && h0.state === 'atk' && h0.kind === 'ult' && h0.t < ULT.hit + 0.02) {
      ctx.fillStyle = 'rgba(6,4,14,' + (0.5 * Math.min(1, h0.t / 0.5)) + ')'; ctx.fillRect(-10, -10, W + 20, H + 20);
    }
    var list = [];
    G.enemies.forEach(function (e) { list.push({ y: e.y, f: function () { drawSkeleton(e); } }); });
    if (G.state !== 'title') list.push({ y: G.hero.y, f: drawHero });
    else list.push({ y: G.hero.y, f: function () { G.hero.anim += 0.016; drawHero(); } });
    list.sort(function (a, b) { return a.y - b.y; });
    list.forEach(function (o) { o.f(); });
    drawDrops(); drawFx();
    G.texts.forEach(function (t) {
      ctx.globalAlpha = Math.min(1, (t.life - t.t) / 0.3);
      txt(t.s, t.x, t.y, t.size, t.col, 'center');
      ctx.globalAlpha = 1;
    });
    ctx.restore();
    if (G.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, G.flash) + ')'; ctx.fillRect(0, 0, W, H); }
    if (G.state !== 'title') drawHud();
    drawOverlay();
  }

  /* ---------- ループ ---------- */
  var last = 0;
  function frame(ts) {
    var dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  function boot() {
    document.getElementById('loadnote').textContent = failed
      ? '読み込めない素材が ' + failed + ' 個あります。ページを開き直してください。'
      : '読み込み完了。画面をクリックして始めます。';
    started = true; newGame();
    if (document.fonts && document.fonts.load) document.fonts.load('900 20px "Zen Kaku Gothic New"').catch(function () {});
  }
  newGame();
  loadAll();
  requestAnimationFrame(frame);

  var fsBtn = document.getElementById('fs');
  function fsFail() { fsBtn.textContent = 'この表示では全画面にできません'; }
  fsBtn.addEventListener('click', function () {
    var st = document.getElementById('stage');
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (st.requestFullscreen) st.requestFullscreen().catch(fsFail);
      else fsFail();
    } catch (e) { fsFail(); }
  });

  // テスト用（遊びには影響しない）
  window.__game = { get: function () { return G; }, stats: function () { return S; }, press: onPress };
})();
</script>
