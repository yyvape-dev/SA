<title>月夜の回廊 試作</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 一画面のアリーナ。暗い石の回廊に合わせた単一の見た目（ライト/ダークの切り替えは行わない）。 */
:root {
  --bg: #0c0a11;
  --panel: #17131f;
  --fg: #ece6f2;
  --muted: #9d93ab;
  --line: #2e2638;
  --accent: #ffb347;
  --ui-op: .5; /* タッチボタンの通常時の濃さ（押している間は1） */
  --font: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; touch-action: none; -webkit-text-size-adjust: 100%; }
body { margin: 0; padding: 0; overflow: hidden; background: #000; color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.6; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
/* 画面いっぱいに表示。16:9の絵は、余った所を黒帯にして収める（横画面前提） */
.wrap { position: fixed; inset: 0; }
.head { display: none; }
#stage { position: absolute; inset: 0; background: #000; overflow: hidden; touch-action: none; }
#game { display: block; width: 100%; height: 100%; outline: none; object-fit: contain; }
#fs { position: absolute; top: max(6px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 3; font: inherit; font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 6px; border: 1px solid var(--line); background: rgba(12,10,17,.55); color: var(--fg); cursor: pointer; opacity: .75; }
.keys { transition: opacity 1.2s; position: absolute; left: 10px; bottom: 8px; z-index: 2; display: flex; flex-direction: column; gap: 1px; padding: 6px 8px; border-radius: 6px; background: rgba(8,6,12,.5); color: var(--muted); font-size: 11.5px; line-height: 1.5; pointer-events: none; }
.keys b { color: var(--fg); font-weight: 700; margin-right: 6px; }
.note { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); z-index: 2; margin: 0; color: var(--muted); font-size: 12px; pointer-events: none; text-shadow: 0 1px 3px #000; }
/* タッチ操作：左下に移動パッド、右下に大きな攻撃ボタン。その周りに、一回り小さいスキルが弧を描いて並ぶ */
.touch { display: none; position: absolute; inset: 0; z-index: 2; pointer-events: none; touch-action: none; user-select: none; -webkit-user-select: none; }
@media (pointer: coarse) { .touch { display: block; } .keys { display: none; } }
#stage.t .touch { display: block; }
.wrap.t .keys { display: none; }
#pad { position: absolute; left: calc(max(14px, env(safe-area-inset-left, 0px)) + 1.5vw); bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); width: clamp(110px, 34vh, 190px); aspect-ratio: 1; border-radius: 50%; background: rgba(23,19,31,.45); border: 2px solid rgba(255,255,255,.25); pointer-events: auto; opacity: var(--ui-op); transition: opacity .08s; }
#pad.pressed { opacity: 1; }
#pad.has-img { background: none; border-color: transparent; }
#knob.has-img { background: none; }
#pad img, .btn img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
#knob { position: absolute; width: 38%; height: 38%; border-radius: 50%; background: var(--accent); opacity: .8; left: 31%; top: 31%; pointer-events: none; }
.btns { --A: clamp(96px, 30vh, 150px); --s: calc(var(--A) * .58); --r: calc((var(--A) + var(--s)) / 2 + 8px);
  position: absolute; right: calc(max(14px, env(safe-area-inset-right, 0px)) + 2.5vw); bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); width: var(--A); height: var(--A); pointer-events: none; }
.btn { position: absolute; font: inherit; font-weight: 900; border-radius: 50%; border: 2px solid rgba(255,255,255,.32); background: rgba(23,19,31,.62); color: var(--fg); touch-action: none; pointer-events: auto; padding: 0; line-height: 1.15; opacity: var(--ui-op); transition: opacity .08s; }
.btn .lbl { position: relative; z-index: 1; }
.btn.has-img { background: none !important; border-color: transparent !important; }
.btn.has-img .lbl { display: none; }
.btn.a { left: 0; top: 0; width: var(--A); height: var(--A); font-size: calc(var(--A) * .2); background: rgba(58,42,20,.78); border-color: var(--accent); }
.btn.s { left: 50%; top: 50%; width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); font-size: calc(var(--s) * .2); transform: translate(calc(var(--cx) * var(--r)), calc(var(--cy) * var(--r))); overflow: hidden; }
.btn.s::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(8,6,14,.74) calc(var(--cd, 0) * 1turn), transparent 0); pointer-events: none; }
.btn.s.cool { border-color: rgba(255,255,255,.14); color: #9d93ab; }
.btn.s small { display: block; font-size: .72em; font-weight: 700; opacity: .8; }
.btn.l { border-color: #b7a6ff; } .btn.k { border-color: #ffcd6e; } .btn.i { border-color: #8fd0ff; } .btn.u { border-color: #ff8a8a; background: rgba(70,24,30,.78); }
.btn { -webkit-tap-highlight-color: transparent; }
.btn.pressed { opacity: 1; filter: brightness(1.35); }
#rot { display: none; position: absolute; inset: 0; z-index: 10; background: #0c0a11; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 20px; font-weight: 900; text-align: center; }
@media (pointer: coarse) and (orientation: portrait) { #rot { display: flex; } }
</style>

<div class="wrap" id="wrap">
  <div class="head"><h1>月夜の回廊 試作</h1></div>
  <div id="stage">
    <canvas id="game" tabindex="0" aria-label="ゲーム画面"></canvas>
    <button id="fs" type="button">全画面</button>
    <div class="touch">
      <div id="pad" aria-label="移動パッド"><div id="knob"></div></div>
      <div class="btns">
        <button class="btn s l" id="btnP" type="button" style="--cx:-0.985;--cy:0.174" data-icon="ui/btn_pull.png"><span class="lbl">吸引</span></button>
        <button class="btn s k" id="btnS" type="button" style="--cx:-0.829;--cy:-0.559" data-icon="ui/btn_shock.png"><span class="lbl">衝撃波</span></button>
        <button class="btn s i" id="btnT" type="button" style="--cx:-0.208;--cy:-0.978" data-icon="ui/btn_thrust.png"><span class="lbl">突き</span></button>
        <button class="btn s u" id="btnU" type="button" style="--cx:0.53;--cy:-0.848" data-icon="ui/btn_ult.png"><span class="lbl">必殺</span></button>
        <button class="btn a" id="btnA" type="button" data-icon="ui/btn_attack.png"><span class="lbl">攻撃</span></button>
      </div>
    </div>
    <div id="rot"><div>画面を横向きにしてください</div></div>
  </div>
  <div class="keys" id="keys">
    <span><b>← ↑ ↓ →</b>移動（WASDも可）</span>
    <span><b>Shift</b>走る</span>
    <span><b>J / Space</b>攻撃（連打で縦斬り→横薙ぎ）</span>
    <span><b>L</b>吸引（敵を引き寄せて拘束）</span>
    <span><b>U</b>必殺技（回転斬り・周囲一掃）</span>
    <span><b>K</b>衝撃波</span>
    <span><b>I</b>貫通の突き（前方を一直線に貫く）</span>
    <span><b>1 2 3</b>強化を選ぶ</span>
    <span><b>R</b>やり直す</span>
  </div>
  <p class="note" id="loadnote">素材を読み込み中です。</p>
</div>

<script>
(function () {
  'use strict';
  var W = 1280, H = 720, BW = 1280; // BW=絵の基準の幅。Wは画面の縦横比に合わせて 1280〜1680 に広がる（黒帯を出さない）
  var cv = document.getElementById('game'), ctx = cv.getContext('2d');
  cv.width = W; cv.height = H;
  function fitW() {
    var st = document.getElementById('stage'), r = st ? st.getBoundingClientRect() : null;
    if (!r || !(r.width > 0) || !(r.height > 0)) return false;
    var nw = Math.max(BW, Math.min(1680, Math.round(H * r.width / r.height)));
    if (Math.abs(nw - W) < 2) return false;
    W = nw; return true;
  }
  var TOUCH = !!((window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || (window.location && /[?&]touch=1/.test(window.location.search || '')));
  (function () { var w = document.getElementById('wrap'), st = document.getElementById('stage'); if (TOUCH && w && w.classList) { w.classList.add('t'); st.classList.add('t'); } })();
  var RES = 1, resTick = 0;
  function fitRes() { // 画面に映る実際の大きさに合わせて内部解像度を上げる（最大2倍）。論理座標は1280×720のまま
    fitW();
    var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    var want = Math.max(1, Math.min(2, Math.round((Math.min(r.width / W, r.height / H) * dpr) * 4) / 4));
    if (!(r.width > 0)) want = RES;
    if (want !== RES || cv.width !== Math.round(W * want)) { RES = want; cv.width = Math.round(W * RES); cv.height = Math.round(H * RES); }
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  }

  /* ---------- 素材 ---------- */
  var RUN_K = 0.86; // 走りの動画はキャラが約1.15倍の大きさで出たため、足元を基準に縮める
  var M = { ax: 362, ay: 379, k: 0.6, clips: { walk: 24, run: 10, atk: 19, rec: 17, idle: 1, ult: 59, atb: 49, thr: 24, atc: 33, dmg: 4 } }; // 待機・歩き・走りは1.0倍で保存。0.6倍で描くと従来と同じ大きさ
  var ATK_A = { ax: 235.2, ay: 328.2, k: 1 }; // 攻撃・構え直しは旧素材（0.6倍で保存）。攻撃の動画を撮り直したら置き換える
  var ATC_A = { ax: 419, ay: 543, k: 0.6 };   // 攻撃A（縦斬り・新）。動画のコマ9〜60から、静止を詰めて使う
  var ATB_A = { ax: 458, ay: 536, k: 0.6 };   // 攻撃B（横薙ぎ）。動画のコマ12〜37と50〜72（頭上の静止は省く）
  var THR_A = { ax: 553.1, ay: 697, k: 0.508 }; // 貫通の突き。元の絵が大きいので、0.508倍で主人公と同じ背丈
  var DMG_A = { ax: 215, ay: 261, k: 0.846 }; // 被弾・死亡（静止画4枚：被弾→のけぞり→踏ん張り→立ち直り）。元絵が小さいので、拡大率で主人公の背丈にそろえた
  var ULT_A = { ax: 446, ay: 568, k: 0.6 }, ULT_F0 = 8; // 必殺技の連番は、動画のコマ8〜66。足元の基準は主人公と同じ高さ
  var IMG = {}, loaded = 0, total = 1, failed = 0, started = false;
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function onDone() { loaded++; if (loaded >= total) boot(); }
  function loadAll() {
    var names = [];
    Object.keys(M.clips).forEach(function (c) { for (var i = 0; i < M.clips[c]; i++) names.push(c + '_' + pad2(i)); });
    total = names.length + 3;
    var bg = new Image(); bg.onload = onDone; bg.onerror = function () { failed++; onDone(); }; bg.src = 'bg.jpg'; IMG.bg = bg;
    ['s1_back', 's1_floor'].forEach(function (k) { var im = new Image(); im.onload = onDone; im.onerror = function () { failed++; onDone(); }; im.src = 'stage/' + k + '.jpg'; IMG[k] = im; });
    names.forEach(function (n) {
      var im = new Image(); im.onload = onDone; im.onerror = function () { failed++; onDone(); };
      im.src = 'sprites/' + n + '.png'; IMG[n] = im;
    });
  }

  /* ---------- 定数と状態 ---------- */
  /* 部屋＝横に長い一枚。segs 個の「戦場」（画面1つぶんの区画）が並ぶ。
     戦場に入るとカメラが固定され、敵を全滅させるとGOが出て、次の戦場へ進める。最後の戦場は右端の出口から次の部屋へ。
     h が画面の高さ(720)より大きい部屋では、カメラが上下にも追従する（y0〜y1 はその部屋で動ける奥行きの帯。背景の絵ができたら使う）。 */
  var ROOMS = [
    { name: '月夜の回廊', w: BW * 3, h: 720, y0: 520, y1: 660, segs: 3, stage: 's1', hz: 500, par: 0.6, zk: 0.8, ds0: 0.9, ds1: 1.15, spread: 50 }, // 手前まで広い床の部屋：帯は広く、判定の奥行きは薄く、敵は奥行きに散る
    { name: '崩れた回廊', w: BW * 4, h: 720, y0: 528, y1: 590, segs: 4 }
  ];
  var ROOM = ROOMS[0], LANE_Y0 = ROOM.y0, LANE_Y1 = ROOM.y1, ZK = ROOM.zk || 1, camX = 0, camY = 0;
  function setRoomVars() { LANE_Y0 = ROOM.y0; LANE_Y1 = ROOM.y1; ZK = ROOM.zk || 1; }
  function LK(k) { return ROOM.segs < 2 ? 0 : Math.round(k * (ROOM.w - W) / (ROOM.segs - 1)); } // k番目の戦場のカメラ位置（画面の左端）
  function depthScale(y) { var a = ROOM.ds0 || 0.9, b = ROOM.ds1 || 1.06; return a + (b - a) * ((y - LANE_Y0) / (LANE_Y1 - LANE_Y0)); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function heroMinX() { return LK(G.seg) + 70; }
  function heroMaxX() { return ((G.phase === 'go' && G.seg < ROOM.segs - 1) ? LK(G.seg + 1) : LK(G.seg)) + W - 70; }
  function camRange() { var a = LK(G.seg); return (G.phase === 'go' && G.seg < ROOM.segs - 1) ? [a, LK(G.seg + 1)] : [a, a]; } // 戦闘中は min=max（固定）
  function updateCam(dt, snap) {
    var h = G.hero, r = camRange(), k = snap ? 1 : Math.min(1, dt * 7), maxY = Math.max(0, ROOM.h - H);
    var tx = clamp(h.x - W * 0.4, r[0], r[1]), ty = clamp(h.y - H * 0.72, 0, maxY);
    camX = clamp(camX + (tx - camX) * k, r[0], r[1]); camY = clamp(camY + (ty - camY) * k, 0, maxY);
  }

  var keys = {}, pad = { x: 0, y: 0, mag: 0 };
  var G, S;

  function newGame() {
    S = { dmg: 1, range: 1, aspd: 1.5, cd: 1, chain: 0, pcd: 1, bind: 0.8 };
    ROOM = ROOMS[0]; setRoomVars(); camX = 0; camY = 0;
    G = {
      roomNo: 0, seg: 0, phase: 'fight', trans: null,
      state: 'title', t: 0, wave: 0, enemies: [], drops: [], parts: [], fx: [], texts: [], booms: [],
      queue: [], qT: 0, shake: 0, freeze: 0, combo: 0, comboT: 0, bestCombo: 0, kills: 0, gold: 0, rare: 0,
      skCD: 0, skMax: 3.2, pullCD: 0, pullMax: 6, thrCD: 0, thrMax: 8, ultCD: 0, ultMax: 14, flash: 0, picks: [], pickOpts: [], upgraded: [],
      hero: { x: 340, y: 560, face: 1, hp: 120, max: 120, state: 'idle', t: 0, anim: 0, sk: false, kind: 'atk', fxT: 0, ringT: 0, h1: false, h2: false, h3: false, v: 0, lastAtkEnd: -9, lastAtkKind: '', x0: 0, buf: 0, cancelT: 0, total: 0, inv: 0, flash: 0, kb: 0 }
    };
  }

  /* ---------- 入力 ---------- */
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
    if (!keys[e.code]) onPress(e.code);
    keys[e.code] = true;
  });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });
  window.addEventListener('blur', function () { keys = {}; });

  function onPress(code) {
    if (!started) return;
    if (G.state === 'title') { startRun(); return; }
    if (G.state === 'dead') { if (code === 'KeyR' || code === 'Space' || code === 'Enter') { newGame(); startRun(); } return; }
    if (G.state === 'pick') {
      if (code === 'Digit1' || code === 'Numpad1') choose(0);
      if (code === 'Digit2' || code === 'Numpad2') choose(1);
      if (code === 'Digit3' || code === 'Numpad3') choose(2);
      return;
    }
    if (code === 'KeyR') { newGame(); startRun(); return; }
    if (code === 'KeyJ' || code === 'Space' || code === 'KeyZ') tryAttack('atk');
    if (code === 'KeyK' || code === 'KeyX') tryAttack('sk');
    if (code === 'KeyL' || code === 'KeyC') tryAttack('pull');
    if (code === 'KeyU' || code === 'KeyV') tryAttack('ult');
    if (code === 'KeyI' || code === 'KeyB') tryAttack('thr');
  }

  function canvasPoint(ev) {
    var r = cv.getBoundingClientRect(), k = Math.min(r.width / W, r.height / H);
    var ox = (r.width - W * k) / 2, oy = (r.height - H * k) / 2;
    return { x: (ev.clientX - r.left - ox) / k, y: (ev.clientY - r.top - oy) / k };
  }
  cv.addEventListener('pointerdown', function (ev) {
    cv.focus();
    if (!started) return;
    var p = canvasPoint(ev);
    if (G.state === 'title') { startRun(); return; }
    if (G.state === 'dead') { newGame(); startRun(); return; }
    if (G.state === 'pick') {
      for (var i = 0; i < 3; i++) {
        var cx = (W - BW) / 2 + 190 + i * 290;
        if (p.x >= cx && p.x <= cx + 270 && p.y >= 210 && p.y <= 520) { choose(i); return; }
      }
    }
  });

  var padEl = document.getElementById('pad'), knob = document.getElementById('knob'), padId = null;
  function padMove(ev) {
    var r = padEl.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2, R = r.width / 2 - 10;
    var dx = ev.clientX - cx, dy = ev.clientY - cy, d = Math.hypot(dx, dy) || 1;
    var k = Math.min(1, d / R);
    pad.x = dx / d * k; pad.y = dy / d * k; pad.mag = k;
    knob.style.transform = 'translate(' + (pad.x * R * 0.55) + 'px,' + (pad.y * R * 0.55) + 'px)';
  }
  padEl.addEventListener('pointerdown', function (ev) { padId = ev.pointerId; padEl.setPointerCapture(ev.pointerId); padEl.classList.add('pressed'); padMove(ev); });
  padEl.addEventListener('pointermove', function (ev) { if (ev.pointerId === padId) padMove(ev); });
  function padEnd(ev) { if (ev.pointerId !== padId) return; padId = null; pad.x = pad.y = pad.mag = 0; knob.style.transform = ''; padEl.classList.remove('pressed'); }
  padEl.addEventListener('pointerup', padEnd); padEl.addEventListener('pointercancel', padEnd);
  /* 連打・ピンチで画面が拡大されるのを防ぐ */
  (function () {
    var lastEnd = 0, opt = { passive: false };
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); }, opt); });
    document.addEventListener('touchmove', function (e) { e.preventDefault(); }, opt);
    document.addEventListener('touchstart', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, opt);
    document.addEventListener('touchend', function (e) { var n = Date.now(); if (n - lastEnd < 350) e.preventDefault(); lastEnd = n; }, opt);
    document.addEventListener('dblclick', function (e) { e.preventDefault(); }, opt);
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    window.addEventListener('resize', function () { resTick = 0; });
    window.addEventListener('orientationchange', function () { resTick = 0; });
  })();
  function tapBtn(id, fn) {
    var el = document.getElementById(id);
    el.addEventListener('pointerdown', function (ev) {
      ev.preventDefault(); el.classList.add('pressed');
      if (!started) return;
      if (G.state === 'title') { startRun(); return; }
      if (G.state === 'dead') { newGame(); startRun(); return; }
      fn();
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { el.addEventListener(n, function () { el.classList.remove('pressed'); }); });
  }
  /* 画像アイコンの差し込み口：ui/ に絵があれば、文字の代わりにその絵を出す（なければ今の見た目のまま）。
     ボタン  ui/btn_attack.png  btn_pull.png  btn_shock.png  btn_thrust.png  btn_ult.png（正方形・透過PNG推奨）
     パッド  ui/pad_base.png（土台）  ui/pad_knob.png（つまみ） */
  function iconSlot(el, src) {
    if (!el) return;
    var im = new Image(); im.alt = ''; im.draggable = false;
    im.onload = function () { el.insertBefore(im, el.firstChild); el.classList.add('has-img'); };

  function frame(ts) {
    var dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
    if (!(TOUCH && window.innerHeight > window.innerWidth)) update(dt); draw();
    requestAnimationFrame(frame);
  }
  function boot() {
    document.getElementById('loadnote').textContent = failed
      ? '読み込めない素材が ' + failed + ' 個あります。ページを開き直してください。'
      : '読み込み完了。画面をクリックして始めます。';
    started = true; newGame();
    if (document.fonts && document.fonts.load) document.fonts.load('900 20px "Zen Kaku Gothic New"').catch(function () {});
  }
  newGame();
  loadAll();
  requestAnimationFrame(frame);

  var fsBtn = document.getElementById('fs');
  function fsFail() { fsBtn.textContent = 'この表示では全画面にできません'; }
  fsBtn.addEventListener('click', function () {
    var st = document.getElementById('stage');
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (st.requestFullscreen) st.requestFullscreen().catch(fsFail);
      else fsFail();
    } catch (e) { fsFail(); }
  });

  // テスト用（遊びには影響しない）
  window.__game = { get: function () { return G; }, stats: function () { return S; }, press: onPress,
    cam: function () { return { x: camX, y: camY, W: W, room: ROOM, LK: LK }; }, setRoom: function (r) { ROOMS[0] = r; enterRoom(0); } };
})();
</script>
