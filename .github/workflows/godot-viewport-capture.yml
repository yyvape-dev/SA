name: Godot real viewport capture
on:
  push:
    branches:
      - test/godot-viewport-capture-20261104
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: godot-viewport-test
    steps:
      - uses: actions/checkout@v4
      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1
      - name: Download Godot stable
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          /tmp/godot --version
      - name: Import project
        run: /tmp/godot --headless --path . --editor --import --quit
      - name: Capture actual Godot viewport
        env:
          CAPTURE_STAGE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p captures
          timeout 90s xvfb-run -a -s '-screen 0 1280x720x24' /tmp/godot --path . --rendering-driver opengl3 --windowed --resolution 1280x720
          test -s captures/actual_00.png
          test -s captures/actual_01.png
          test -s captures/actual_02.png
      - name: Save screenshots as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-godot-viewport
          path: godot-viewport-test/captures/*.png
          if-no-files-found: warn
