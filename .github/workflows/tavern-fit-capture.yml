name: Tavern facade real Godot capture
on:
  push:
    branches: [test/godot-neon-greybox-20261105]
    paths:
      - godot-viewport-test/scripts/tavern_fit.gd
      - godot-viewport-test/fit_assets/**
      - godot-viewport-test/tools/tavern_contact_sheet.py
      - .github/workflows/tavern-fit-capture.yml
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: godot-viewport-test
    steps:
      - uses: actions/checkout@v4
      - name: Install software rendering and image comparison
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1 python3-pil python3-numpy
      - name: Download Godot 4.4.1
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
      - name: Import project
        run: /tmp/godot --headless --path . --editor --import --quit
      - name: Render actual tavern scene
        env:
          CAPTURE_TAVERN: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          mkdir -p captures/tavern_fit
          timeout 100s xvfb-run -a -s '-screen 0 1600x900x24' /tmp/godot --path . --rendering-driver opengl3 --windowed --resolution 1600x900 res://tavern_fit.tscn 2>&1 | tee captures/tavern_fit/run.log
          test -s captures/tavern_fit/capture_metadata.json
          if grep -E 'SCRIPT ERROR|ERROR:' captures/tavern_fit/run.log; then exit 1; fi
      - name: Compare views and occlusion
        run: python3 tools/tavern_contact_sheet.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tavern-fit-real-godot
          path: godot-viewport-test/captures/tavern_fit/
          if-no-files-found: error
