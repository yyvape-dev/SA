name: Test approved SA2 Pixabay audio fetch
on:
  push:
    branches:
      - feat/sa2-rana-combat-sfx-20261111
    paths:
      - .github/workflows/sa2-audio-fetch.yml
  workflow_dispatch:
jobs:
  audio:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Probe approved Pixabay audio previews
        shell: bash
        run: |
          python - <<'PY'
          import requests, re, json, html
          urls = [
             "https://pixabay.com/sound-effects/film-special-effects-sword-slash-and-swing-185432/",
             "https://pixabay.com/sound-effects/film-special-effects-sword-blade-slicing-flesh-352708/",
             "https://pixabay.com/sound-effects/film-special-effects-sword-block-the-ballad-of-blades-257226/",
          ]
          for url in urls:
              r = requests.get(url, timeout=30, headers={'User-Agent':'Mozilla/5.0'})
              print("page",r.status_code,len(r.content),url)
              txt=html.unescape(r.text).replace('\\/','/')
              matches=re.findall(r'https?://cdn\\.pixabay\\.com/audio/[^"\'\s<>]+\\.mp3(?:\\?[^"\'\s<>]*)?',txt)
              print("media_candidates",len(matches))
              if not matches: raise SystemExit("No downloadable source identified; stop rather than replace")
              print("first candidate located",matches[0].split("?")[0])
          PY
