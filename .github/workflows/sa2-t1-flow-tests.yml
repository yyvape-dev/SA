name: SA2 T1 common flow contract tests
on:
  push:
    branches:
      - feat/sa2-t1-common-flow-20261108
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.4.1 stable
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          /tmp/godot --version
      - name: Godot import and parse all scripts
        run: /tmp/godot --headless --path godot-viewport-test --editor --import --quit
      - name: Execute T1 contract tests
        run: /tmp/godot --headless --path godot-viewport-test --script res://tests/sa2_t1_flow_test.gd
