name: SA2 T1 common flow and real viewport tests
on:
  push:
    branches: [feat/sa2-t1-common-flow-20261108]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual display and software GL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1 ffmpeg
      - name: Download Godot 4.4.1 stable
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          /tmp/godot --version
      - name: Exclude unrelated preexisting corrupt tavern image from T1 test workspace
        run: |
          test -s godot-viewport-test/fit_assets/tavern_front.png
          mv godot-viewport-test/fit_assets/tavern_front.png /tmp/sa2_t1_tavern_unrelated.png
      - name: Import project and require clean script parse
        run: |
          set -o pipefail
          /tmp/godot --headless --path godot-viewport-test --editor --import --quit 2>&1 | tee /tmp/sa2-t1-import.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/sa2-t1-import.log; then exit 1; fi
      - name: Execute T1 contract tests
        run: |
          set -o pipefail
          /tmp/godot --headless --path godot-viewport-test --script res://tests/sa2_t1_flow_test.gd 2>&1 | tee /tmp/sa2-t1-contract.log
          grep -q 'SA2_T1_PASS: 37 checks' /tmp/sa2-t1-contract.log
          if grep -E 'SCRIPT ERROR|ERROR:|SA2_T1_FAIL' /tmp/sa2-t1-contract.log; then exit 1; fi
      - name: Real Godot T1 scene and UI capture
        env:
          CAPTURE_SA2_T1: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          timeout 100s xvfb-run -a -s '-screen 0 1600x900x24' /tmp/godot --path godot-viewport-test --rendering-driver opengl3 --audio-driver Dummy --windowed --resolution 1600x900 res://sa2_t1_demo.tscn 2>&1 | tee /tmp/sa2-t1-scene.log
          grep -q 'SA2_T1_SCENE_PASS' /tmp/sa2-t1-scene.log
          if grep -E 'SCRIPT ERROR|ERROR:|Assertion failed' /tmp/sa2-t1-scene.log; then exit 1; fi
          for name in 01_explore 02_dialogue 03_instance_state 04_completed; do
            test -s "godot-viewport-test/captures/sa2_t1/${name}.png"
          done
      - name: Assemble review MP4 from actual Godot captures (static frames, not gameplay recording)
        run: |
          set -e
          cd godot-viewport-test/captures/sa2_t1
          printf "file '01_explore.png'\nduration 2\nfile '02_dialogue.png'\nduration 2\nfile '03_instance_state.png'\nduration 2\nfile '04_completed.png'\nduration 2\nfile '04_completed.png'\n" > sa2_t1_frames.txt
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i sa2_t1_frames.txt -vf "fps=12,scale=1280:720:flags=lanczos,format=yuv420p" -c:v libx264 -preset veryfast -crf 22 -movflags +faststart sa2_t1_screen_review.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 sa2_t1_screen_review.mp4
          test -s sa2_t1_screen_review.mp4
      - name: Record continuous playable dialogue in Godot Movie Maker
        env:
          SA2_DIALOGUE_MOVIE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          mkdir -p godot-viewport-test/captures/sa2_dialogue
          timeout 180s xvfb-run -a -s '-screen 0 1600x900x24' /tmp/godot --path godot-viewport-test --rendering-driver opengl3 --audio-driver Dummy --windowed --resolution 1600x900 --write-movie captures/sa2_dialogue/dialogue.avi --fixed-fps 24 res://sa2_dialogue_playable.tscn 2>&1 | tee /tmp/sa2-dialogue-movie.log
          grep -q 'SA2_DIALOGUE_DEMO_PASS' /tmp/sa2-dialogue-movie.log
          if grep -E 'SCRIPT ERROR|ERROR:|Assertion failed' /tmp/sa2-dialogue-movie.log; then exit 1; fi
          test -s godot-viewport-test/captures/sa2_dialogue/dialogue.avi
          ffmpeg -hide_banner -loglevel error -y -i godot-viewport-test/captures/sa2_dialogue/dialogue.avi -vf 'scale=1280:720:flags=lanczos,format=yuv420p' -c:v libx264 -preset veryfast -crf 22 -movflags +faststart -an godot-viewport-test/captures/sa2_dialogue/dialogue_playable.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 godot-viewport-test/captures/sa2_dialogue/dialogue_playable.mp4
          test -s godot-viewport-test/captures/sa2_dialogue/dialogue_playable.mp4
      - name: Upload actual Godot PNG evidence and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa2-t1-real-viewport-and-logs
          path: |
            godot-viewport-test/captures/sa2_t1/*.png
            godot-viewport-test/captures/sa2_t1/*.mp4
            godot-viewport-test/captures/sa2_dialogue/*.mp4
            /tmp/sa2-dialogue-movie.log
            /tmp/sa2-t1-*.log
          if-no-files-found: warn
