name: SA2 T2 existing-sequel dialogue compatibility
on:
  push:
    branches:
      - feat/sa2-t2-sequel-integration-20261108
  workflow_dispatch:
jobs:
  dialogue_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y unzip libgl1-mesa-dri fonts-noto-cjk xvfb ffmpeg
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          /tmp/godot --version
      - name: Import sequel project
        run: |
          set -o pipefail
          /tmp/godot --headless --path sequel --editor --import --quit 2>&1 | tee /tmp/t2-import.log
      - name: Run inherited T1 state contract in sequel
        run: |
          set -o pipefail
          /tmp/godot --headless --path sequel --script res://tests/sa2_t1_flow_test.gd 2>&1 | tee /tmp/t2-flow.log
          grep -q 'SA2_T1_PASS: 37 checks' /tmp/t2-flow.log
          if grep -E 'SCRIPT ERROR|ERROR:|SA2_T1_FAIL' /tmp/t2-flow.log; then exit 1; fi
      - name: Run inherited T1.5 dialogue contract in sequel
        run: |
          set -o pipefail
          /tmp/godot --headless --path sequel --script res://tests/sa2_t1_5_dialogue_test.gd 2>&1 | tee /tmp/t2-dialogue.log
          grep -q 'SA2_T1_5_PASS' /tmp/t2-dialogue.log
          if grep -E 'SCRIPT ERROR|ERROR:|SA2_T1_5_FAIL' /tmp/t2-dialogue.log; then exit 1; fi
      - name: T2 Lily manual combat contract
        run: |
          set -o pipefail
          timeout 25s /tmp/godot --headless --path sequel --script res://tests/sa2_t2_lily_manual_test.gd 2>&1 | tee /tmp/t2-lily.log
          grep -q 'SA2_T2_LILY_MANUAL_PASS' /tmp/t2-lily.log
          if grep -E 'SCRIPT ERROR|ERROR:|SA2_T2_LILY_MANUAL_FAIL' /tmp/t2-lily.log; then exit 1; fi
      - name: T2 scene parser and startup smoke test
        env:
          SA2_T2_MOVIE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          timeout 35s /tmp/godot --headless --path sequel --quit-after 4 res://sa2_t2_playable.tscn 2>&1 | tee /tmp/t2-startup.log
          if grep -E 'SCRIPT ERROR|ERROR:|SA2_T2_FAIL|Parse Error' /tmp/t2-startup.log; then exit 1; fi
      - name: Record continuous Godot C1-06 playable training
        env:
          SA2_T2_MOVIE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          mkdir -p sequel/captures/sa2_t2
          timeout 180s xvfb-run -a -s '-screen 0 1280x720x24' /tmp/godot --path sequel --rendering-driver opengl3 --audio-driver Dummy --windowed --resolution 1280x720 --write-movie captures/sa2_t2/t2.avi --fixed-fps 24 res://sa2_t2_playable.tscn 2>&1 | tee /tmp/t2-movie.log
          grep -q 'SA2_T2_MOVIE_PASS' /tmp/t2-movie.log
          if grep -E 'SCRIPT ERROR|ERROR:|SA2_T2_MOVIE_FAIL|SA2_T2_FAIL' /tmp/t2-movie.log; then exit 1; fi
          test -s sequel/captures/sa2_t2/t2.avi
          ffmpeg -hide_banner -loglevel error -y -i sequel/captures/sa2_t2/t2.avi -vf 'scale=960:540:flags=lanczos,format=yuv420p' -c:v libx264 -preset veryfast -crf 26 -movflags +faststart -an sequel/captures/sa2_t2/t2.mp4
          test -s sequel/captures/sa2_t2/t2.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 sequel/captures/sa2_t2/t2.mp4
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa2-t2-compatibility-logs
          path: |
            /tmp/t2-import.log
            /tmp/t2-dialogue.log
            /tmp/t2-flow.log
            /tmp/t2-lily.log
            /tmp/t2-movie.log
            /tmp/t2-startup.log
            sequel/captures/sa2_t2/t2.mp4
          if-no-files-found: warn
