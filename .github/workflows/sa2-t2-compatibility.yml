name: SA2 T2 existing-sequel dialogue compatibility
on:
  push:
    branches:
      - feat/sa2-t2-sequel-integration-20261108
  workflow_dispatch:
jobs:
  dialogue_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y unzip libgl1-mesa-dri fonts-noto-cjk
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          /tmp/godot --version
      - name: Import sequel project
        run: |
          set -o pipefail
          /tmp/godot --headless --path sequel --editor --import --quit 2>&1 | tee /tmp/t2-import.log
      - name: Run inherited T1 state contract in sequel
        run: |
          set -o pipefail
          /tmp/godot --headless --path sequel --script res://tests/sa2_t1_flow_test.gd 2>&1 | tee /tmp/t2-flow.log
          grep -q 'SA2_T1_PASS: 37 checks' /tmp/t2-flow.log
          if grep -E 'SCRIPT ERROR|ERROR:|SA2_T1_FAIL' /tmp/t2-flow.log; then exit 1; fi
      - name: Run inherited T1.5 dialogue contract in sequel
        run: |
          set -o pipefail
          /tmp/godot --headless --path sequel --script res://tests/sa2_t1_5_dialogue_test.gd 2>&1 | tee /tmp/t2-dialogue.log
          grep -q 'SA2_T1_5_PASS' /tmp/t2-dialogue.log
          if grep -E 'SCRIPT ERROR|ERROR:|SA2_T1_5_FAIL' /tmp/t2-dialogue.log; then exit 1; fi
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa2-t2-compatibility-logs
          path: |
            /tmp/t2-import.log
            /tmp/t2-dialogue.log
            /tmp/t2-flow.log
          if-no-files-found: warn
