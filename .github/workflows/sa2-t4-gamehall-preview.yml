name: SA2 T4 gamehall D2 isolated preview
on:
  push:
    branches:
      - test/sa2-t4-gamehall-relayout-20261109
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sa2-t4-gamehall-preview
  cancel-in-progress: true
jobs:
  render_t4_gamehall:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install tested project engine Godot 4.7.2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y unzip libgl1-mesa-dri fonts-noto-cjk xvfb
          GODOT_SHA256=cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
          for url in \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip; do
            rm -f /tmp/godot.zip
            if curl -fL --retry 6 --retry-all-errors --retry-delay 3 -o /tmp/godot.zip "$url" && echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum -c -; then
              break
            fi
          done
          test -s /tmp/godot.zip
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          /tmp/godot --version
      - name: Convert exact supplied source JPEG into Godot-ready alpha PNG
        run: |
          set -euo pipefail
          python3 -m venv /tmp/t4-py
          /tmp/t4-py/bin/pip install --disable-pip-version-check Pillow==11.3.0 numpy scipy opencv-python-headless==4.12.0.88
          /tmp/t4-py/bin/python -I sequel/tools/t4_gamehall_prepare_art.py \
            --source sequel/art/painted_bt_src/gamehall_user_original_20261109.jpeg \
            --out sequel/art/painted_bt/gamehall_user_rgba.png 2>&1 | tee /tmp/t4-art.log
          grep -q 'T4_ART_PASS' /tmp/t4-art.log
          test -s sequel/art/painted_bt/gamehall_user_rgba.png
          test -s sequel/art/painted_bt/gamehall_user_rgba_qa.json
          grep -q 'T4_TRIM_PASS' /tmp/t4-art.log
          test -s sequel/art/painted_bt/gamehall_user_trimmed.png
          test -s sequel/art/painted_bt/gamehall_user_trimmed_qa.json
          /tmp/t4-py/bin/python -I sequel/tools/t4_gamehall_guide.py \
            --out sequel/captures/t4-gamehall/gamehall_geometry_guide.png \
            --preview-out sequel/art/painted_bt/gamehall_preview_guide.png 2>&1 | tee /tmp/t4-guide.log
          grep -q 'T4_GUIDE_PREVIEW_PASS' /tmp/t4-guide.log
          test -s sequel/art/painted_bt/gamehall_preview_guide.png
          grep -q 'T4_GUIDE_TIGHT_PASS' /tmp/t4-guide.log
          test -s sequel/art/painted_bt/gamehall_preview_guide_tight.png
      - name: Recover approved user artwork exactly and enlarge without aspect distortion
        run: |
          set -euo pipefail
          /tmp/t4-py/bin/python -I sequel/tools/t4_approved_prepare_preview.py 2>&1 | tee /tmp/t4-approved-prepare.log
          grep -q 'T4_APPROVED_PREP_PASS' /tmp/t4-approved-prepare.log
          test -s sequel/art/painted_bt/gamehall_approved_16m_preview.png
          test -s sequel/art/painted_bt/gamehall_approved_16m_preview.json
      - name: Derive original-pixel moving parts and fill hidden background
        run: |
          set -euo pipefail
          /tmp/t4-py/bin/python -I sequel/tools/t4_gamehall_make_motion_layers.py 2>&1 | tee /tmp/t4-motion-prepare.log
          grep -q 'T4_MOTION_LAYER_PREP_PASS' /tmp/t4-motion-prepare.log
          for name in left_slot_machine right_slot_machine cloaked_man left_woman right_woman roulette_cluster background_clean; do
            test -s "sequel/art/painted_bt/gamehall_motion/${name}.png"
          done
          test -s sequel/art/painted_bt/gamehall_motion/motion_manifest.json
      - name: Import actual sequel project
        run: |
          set -euo pipefail
          /tmp/godot --headless --path sequel --editor --import --quit 2>&1 | tee /tmp/t4-import.log
          if grep -E 'SCRIPT ERROR|Parse Error' /tmp/t4-import.log; then exit 1; fi
      - name: Capture before/after with actual D2 Godot camera
        env:
          TOWN: back
          CAMV: D2
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p sequel/captures/t4-gamehall
          timeout 180s xvfb-run -a -s '-screen 0 1688x780x24' /tmp/godot --path sequel --rendering-driver opengl3 --audio-driver Dummy --windowed --resolution 1688x780 --fixed-fps 60 --script res://tests/sa2_t4_gamehall_relayout_capture.gd 2>&1 | tee /tmp/t4-preview.log
          grep -q 'T4_GODOT_PREVIEW_PASS captures=13' /tmp/t4-preview.log
          grep -q 'T4_PHYSICAL_FACADE_CHECK' /tmp/t4-preview.log
          grep -q 'T4_TRIMMED_ROOF_TOP' /tmp/t4-preview.log
          grep -q 'T4_SCALE_TRIAL_PASS width=14.00m' /tmp/t4-preview.log
          grep -q 'T4_SCALE_TRIAL_PASS width=16.00m' /tmp/t4-preview.log
          if grep -E 'SCRIPT ERROR|Parse Error|T4_GODOT_PREVIEW_FAIL' /tmp/t4-preview.log; then exit 1; fi
          test -s sequel/captures/t4-gamehall/before_d2_x10p5.png
          test -s sequel/captures/t4-gamehall/painted_d2_x10p5.png
          test -s sequel/captures/t4-gamehall/painted_d2_x16p0.png
          test -s sequel/captures/t4-gamehall/painted_d2_x5p2.png
          test -s sequel/captures/t4-gamehall/guide_d2_x10p5.png
          test -s sequel/captures/t4-gamehall/guide_d2_x5p2.png
          test -s sequel/captures/t4-gamehall/guide_d2_x16p0.png
          for width in 14 16; do
            for view in center left right; do
              test -s sequel/captures/t4-gamehall/scale_${width}m_${view}.png
            done
          done
          file sequel/captures/t4-gamehall/*.png
          sha256sum sequel/captures/t4-gamehall/*.png
      - name: Capture the actual approved 16m casino painting in Godot D2
        env:
          TOWN: back
          CAMV: D2
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p sequel/captures/t4-gamehall-approved
          timeout 180s xvfb-run -a -s '-screen 0 1688x780x24' /tmp/godot --path sequel --rendering-driver opengl3 --audio-driver Dummy --windowed --resolution 1688x780 --fixed-fps 60 --script res://tests/sa2_t4_approved_art_capture.gd 2>&1 | tee /tmp/t4-approved-capture.log
          grep -q 'T4_APPROVED_D2_PREVIEW_PASS captures=3' /tmp/t4-approved-capture.log
          if grep -E 'SCRIPT ERROR|Parse Error|T4_APPROVED_PREVIEW_FAIL' /tmp/t4-approved-capture.log; then exit 1; fi
          for view in center left right; do
            test -s sequel/captures/t4-gamehall-approved/approved_16m_${view}.png
          done
      - name: Execute actual Godot micro-motion loop and capture 24 frames
        env:
          TOWN: back
          CAMV: D2
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p sequel/captures/t4-gamehall-motion
          timeout 180s xvfb-run -a -s '-screen 0 1688x780x24' /tmp/godot --path sequel --rendering-driver opengl3 --audio-driver Dummy --windowed --resolution 1688x780 --fixed-fps 60 --script res://tests/sa2_t4_gamehall_motion_capture.gd 2>&1 | tee /tmp/t4-motion-capture.log
          grep -q 'T4_MOTION_CAPTURE_PASS frames=24' /tmp/t4-motion-capture.log
          if grep -E 'SCRIPT ERROR|Parse Error|T4_MOTION_FAIL' /tmp/t4-motion-capture.log; then exit 1; fi
          test "$(find sequel/captures/t4-gamehall-motion -name 'frame_*.png' | wc -l)" -eq 24
      - name: Encode actual captured frames and verify nonstatic movement
        run: |
          set -euo pipefail
          /tmp/t4-py/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import base64, hashlib, json, numpy as np
          root = Path("sequel/captures/t4-gamehall-motion")
          paths = sorted(root.glob("frame_*.png"))
          assert len(paths)==24,len(paths)
          imgs = [Image.open(p).convert("RGB") for p in paths]
          assert all(im.size == (1688,780) for im in imgs)
          arr = np.stack([np.asarray(im,dtype=np.int16) for im in imgs])
          baseline = arr[0]
          changes = [int(np.count_nonzero(np.any(abs(frame-baseline)>3,axis=2))) for frame in arr]
          hashes = [hashlib.sha256(p.read_bytes()).hexdigest() for p in paths]
          unique = len(set(hashes))
          assert unique >= 12, ("Insufficient distinct real Godot frames",unique)
          assert max(changes)>150, ("No visible changes",max(changes))
          preview = [im.resize((844,390),Image.Resampling.LANCZOS) for im in imgs]
          gif = root/"gamehall_micro_motion_actual_godot.gif"
          preview[0].save(gif,save_all=True,append_images=preview[1:],duration=83,loop=0,optimize=True)
          sheet=Image.new("RGB",(1688,780))
          draw=ImageDraw.Draw(sheet)
          for index,frame in enumerate((0,6,12,18)):
              x=(index%2)*844; y=(index//2)*390
              sheet.paste(preview[frame],(x,y))
              draw.rectangle((x,y,x+85,y+22),fill=(10,9,15))
              draw.text((x+7,y+4),f"Godot {frame:02d}",fill="white")
          sheet.save(root/"motion_contact_sheet.png",optimize=True)
          jpg = root/"motion_contact_inline.jpg"
          imgs[6].save(jpg,"JPEG",quality=85,optimize=True)
          (root/"motion_contact_inline.b64.txt").write_text(base64.b64encode(jpg.read_bytes()).decode("ascii"),encoding="ascii")
          qa={"godot_frame_count":24,"resolution":[1688,780],"unique_frames_sha256":unique,
              "changed_pixels_vs_first":changes,"gif":gif.name,
              "original_layer_source":"approved painting SHA d9e200bb...","motion_render":"actual Godot 4.7.2",
              "visual_fidelity":"NOT TESTED until screenshot inspection"}
          (root/"motion_qa.json").write_text(json.dumps(qa,indent=2)+"\n")
          print("T4_MOTION_FRAMES_PASS",json.dumps(qa))
          PY
      - name: Prepare direct-chat previews from Godot screenshots without redraw
        run: |
          set -euo pipefail
          /tmp/t4-py/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64
          folder = Path("sequel/captures/t4-gamehall")
          for stem in ("scale_14m_center", "scale_14m_left", "scale_14m_right", "scale_16m_center", "scale_16m_left", "scale_16m_right"):
              source = folder / (stem + ".png")
              with Image.open(source) as image:
                  assert image.size == (1688, 780), (stem, image.size)
                  jpeg = folder / (stem + "_inline.jpg")
                  image.convert("RGB").save(jpeg, "JPEG", quality=84, optimize=True)
              b64_text = base64.b64encode(jpeg.read_bytes()).decode("ascii")
              (folder / (stem + "_inline.b64.txt")).write_text(b64_text, encoding="ascii")
              print("T4_INLINE_PROOF", stem, jpeg.stat().st_size)
          PY
      - name: Make lossless-in-content JPEG screenshot previews for inline chat
        run: |
          set -euo pipefail
          /tmp/t4-py/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64
          folder = Path("sequel/captures/t4-gamehall-approved")
          for view in ("center","left","right"):
              stem = "approved_16m_" + view
              image_path = folder/(stem+".png")
              with Image.open(image_path) as picture:
                  assert picture.size == (1688,780), picture.size
                  jpg=folder/(stem+"_inline.jpg")
                  picture.convert("RGB").save(jpg,"JPEG",quality=86,optimize=True)
              (folder/(stem+"_inline.b64.txt")).write_text(base64.b64encode(jpg.read_bytes()).decode("ascii"),encoding="ascii")
              print("T4_APPROVED_INLINE_PASS",view,jpg.stat().st_size)
          PY
      - name: Produce deterministic physical-size guide (not finished art)
        run: |
          set -euo pipefail
          /tmp/t4-py/bin/python -I sequel/tools/t4_gamehall_guide.py --out sequel/captures/t4-gamehall/gamehall_geometry_guide.png
          test -s sequel/captures/t4-gamehall/gamehall_geometry_guide.png
          test -s sequel/captures/t4-gamehall/gamehall_geometry_guide.json
      - name: Upload actual Godot screenshots and full run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa2-t4-gamehall-real-godot-proof
          path: |
            sequel/captures/t4-gamehall/*.png
            sequel/captures/t4-gamehall-approved/*.png
            sequel/captures/t4-gamehall-motion/*
            sequel/art/painted_bt/gamehall_motion/*.png
            sequel/art/painted_bt/gamehall_motion/*.json
            /tmp/t4-motion-prepare.log
            /tmp/t4-motion-capture.log
            sequel/captures/t4-gamehall-approved/*_inline.*
            sequel/art/painted_bt/gamehall_approved_16m_preview.png
            sequel/art/painted_bt/gamehall_approved_16m_preview.json
            /tmp/t4-approved-prepare.log
            /tmp/t4-approved-capture.log
            sequel/captures/t4-gamehall/*_inline.*
            sequel/captures/t4-gamehall/*.json
            /tmp/t4-import.log
            /tmp/t4-preview.log
            /tmp/t4-art.log
            sequel/art/painted_bt/gamehall_user_rgba.png
            sequel/art/painted_bt/gamehall_user_rgba_qa.json
            sequel/art/painted_bt/gamehall_user_trimmed.png
            sequel/art/painted_bt/gamehall_user_trimmed_qa.json
            sequel/art/painted_bt/gamehall_preview_guide.png
            sequel/art/painted_bt/gamehall_preview_guide_tight.png
            sequel/art/painted_bt/gamehall_preview_guide_tight.json
            /tmp/t4-guide.log
          if-no-files-found: warn
      - name: Preserve screenshot PNG binaries on the T4-only branch for inspection
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f sequel/art/painted_bt/gamehall_motion/*.png sequel/art/painted_bt/gamehall_motion/*.json sequel/captures/t4-gamehall-motion/*.png sequel/captures/t4-gamehall-motion/*.gif sequel/captures/t4-gamehall-motion/*.json sequel/captures/t4-gamehall-motion/*_inline.* 
          git add -f sequel/art/painted_bt/gamehall_approved_16m_preview.png sequel/art/painted_bt/gamehall_approved_16m_preview.json sequel/captures/t4-gamehall-approved/*.png sequel/captures/t4-gamehall-approved/*_inline.* sequel/captures/t4-gamehall/*.png sequel/captures/t4-gamehall/*.json sequel/captures/t4-gamehall/*_inline.* sequel/art/painted_bt/gamehall_user_rgba.png sequel/art/painted_bt/gamehall_user_rgba_qa.json sequel/art/painted_bt/gamehall_user_trimmed.png sequel/art/painted_bt/gamehall_user_trimmed_qa.json sequel/art/painted_bt/gamehall_preview_guide.png sequel/art/painted_bt/gamehall_preview_guide_tight.png sequel/art/painted_bt/gamehall_preview_guide_tight.json
          git commit -m 'test(t4): preserve approved 16m painting and real Godot D2 screenshots [skip ci]'
          git push origin HEAD:test/sa2-t4-gamehall-relayout-20261109
