<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SA 戦闘キャラの大きさ比べ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1b1712;color:#eee6d6;font-family:system-ui,sans-serif}header{position:sticky;top:0;z-index:2;background:#1b1712f5;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}a{color:#edc974}button,select,input[type=number]{background:#30281e;color:#eee6d6;border:1px solid #806a45;border-radius:6px;padding:7px;font-size:14px}button[aria-pressed=true]{background:#c9a24a;color:#1b1712}p{margin:10px 12px;line-height:1.6;font-size:13px}#wrap{overflow:auto;margin:0 8px;background:linear-gradient(#3a4a5a,#6a7a6a 80%,#5a4a32 80%)}canvas{display:block}#panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;padding:12px}.row{padding:10px;background:#2a241c;border:1px solid #5b4930;border-radius:8px}.row label{display:block}.row input[type=range]{width:100%}.row input[type=number]{width:80px}textarea{display:block;width:calc(100% - 24px);margin:12px;background:#14110d;color:#eee6d6;padding:10px;min-height:110px}#status{color:#f0c070}#status.error{color:#ff9a8b}.controls{padding:8px 12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
</style></head><body>
<header><a href="lineup.html">会話の立ち絵</a><b>戦闘キャラの大きさ比べ</b><button id="duel">一騎打ち</button><button id="action">アクション</button><button id="all">全員</button><button id="two">2人</button><select id="a" aria-label="比較する1人目"></select><select id="b" aria-label="比較する2人目"></select></header>
<p>足元をそろえて比較します。水色＝50ごとの基準線、紫＝構えの基準高。素材によって左右の向きが異なります。各モードの現行コードからサイズを読み込みます。倍率1.00が現在の設定です。調整はこのページ内だけで、ゲームには自動保存されません。「数値をコピー」で送ってください。</p>
<div class="controls"><label>動き <select id="motion"><option value="idle">構え</option><option value="run">走り・歩き</option><option value="attack0">攻撃1</option><option value="attack1">攻撃2</option><option value="attack2">攻撃3</option><option value="attack3">攻撃4・大技</option></select></label><button id="pause">一時停止</button><button id="step">1コマ進む</button><label>コマ <input id="frame" type="range" min="0" max="0" value="0"></label><label>表示倍率 <select id="zoom"><option value="1">×1</option><option value="1.5" selected>×1.5</option><option value="2">×2</option></select></label><button id="reset">このモードを元に戻す</button><button id="copy">数値をコピー</button></div>
<p id="note"></p><p id="status" role="status">設定を読み込み中…</p><div id="wrap"><canvas id="sheet" aria-label="キャラクター比較"></canvas></div><div id="panel"></div><label for="out"><p>コピーする調整値（選択して手動コピーもできます）</p></label><textarea id="out" readonly></textarea>
<script type="module" src="battle-lineup.js?v=1799000000"></script></body></html>
