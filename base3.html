<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>通常パート試作3（断面の拠点）</title>
<style>
:root{--bg:#07090f;--pn:rgba(12,16,27,.94);--line:#2b3347;--tx:#e8edf8;--dim:#9aa6c2;--gold:#ffd27a;--red:#ff7f7f;--green:#7fe29a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.app{height:100dvh;max-width:620px;margin:0 auto;position:relative;overflow:hidden}
.top{position:absolute;top:0;left:0;right:0;background:rgba(12,16,27,.86);border-bottom:1px solid var(--line);padding:calc(5px + env(safe-area-inset-top)) 8px 6px;z-index:5}
.r1{display:flex;gap:8px;align-items:center}
.weeks{flex:1;display:flex;gap:2px}
.wk{flex:1;height:18px;border-radius:3px;background:#1a2133;font-size:10px;text-align:center;line-height:18px;color:var(--dim)}
.wk.now{background:var(--gold);color:#222;font-weight:700}.wk.past{opacity:.35}.wk.raid{box-shadow:inset 0 -3px 0 var(--red)}.wk.boss{box-shadow:inset 0 -3px 0 #ff3b3b;color:var(--red)}
.ap{font-size:15px;font-weight:700;color:var(--gold);white-space:nowrap;letter-spacing:1px}.ap small{font-size:11px;color:var(--red);letter-spacing:0}
.res{display:grid;grid-template-columns:1fr 1.25fr .8fr .8fr;gap:5px;margin-top:5px}
.blk{background:#141b2c;border:1px solid var(--line);border-radius:7px;padding:2px 6px;position:relative;min-height:42px}
.blk .l{font-size:10.5px;color:var(--dim)}.blk .v{font-size:18px;font-weight:700;line-height:1.1}.blk .s{font-size:10.5px;color:var(--dim)}
.chip{position:absolute;right:4px;top:2px;font-size:12px;font-weight:700;padding:0 5px;border-radius:9px}
.chip.up{background:rgba(127,226,154,.22);color:var(--green)}.chip.dn{background:rgba(255,127,127,.24);color:var(--red)}
.mbar{height:6px;background:#000;border-radius:3px;position:relative;margin-top:2px;overflow:hidden}.mbar i{position:absolute;left:0;top:0;bottom:0}.mbar u{position:absolute;top:0;bottom:0;width:1px;background:#fff7}
.pulse{animation:pl .5s}@keyframes pl{0%{background:#4a5b8a}100%{background:#141b2c}}
.gh{display:flex;justify-content:space-between;gap:6px;font-size:12px;margin-top:5px}.gh b{color:var(--gold)}
.gb{height:13px;background:#0a0d16;border-radius:5px;position:relative;overflow:hidden;border:1px solid var(--line);margin-top:2px}
.gb .d{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2b6fc2,#5aa8ff)}
.gb .g{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#9fe0ffaa 0 4px,#5aa8ff66 4px 8px)}
.gb .gm{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#ff7f7f77 0 4px,#ff7f7f33 4px 8px)}
.gb .e{position:absolute;top:0;bottom:0;background:rgba(255,100,100,.4);border-left:2px solid var(--red);border-right:2px solid var(--red)}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;background:#05070c;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}.stage::-webkit-scrollbar{display:none}
.sw{position:relative;flex:none;margin:auto}
.sw svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.z{fill:transparent;cursor:pointer}
.tag{position:absolute;transform:translate(0,-100%);background:rgba(8,11,20,.82);border:1px solid #3a4566;border-radius:8px;padding:0 6px;font-size:11.5px;white-space:nowrap;pointer-events:none;line-height:1.5}
.tag .pp{color:var(--gold);letter-spacing:1px}.tag.sel{border-color:var(--gold)}
.pop{position:absolute;z-index:6;background:rgba(10,13,24,.95);border:2px solid var(--gold);border-radius:11px;padding:5px;display:flex;flex-direction:column;gap:4px;width:172px}
.pop button{background:#161d31;border:1px solid var(--line);border-radius:8px;padding:5px 8px;text-align:left}
.pop button small.go2{color:var(--gold);font-weight:700}.pop button.sel{border-color:var(--gold);background:#27345a}.pop button b{display:block;font-size:14px}.pop button small{display:block;font-size:11px;color:var(--dim);line-height:1.25}
.pop .hd{font-size:11px;color:var(--gold);padding:0 3px}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(0,0,0,.8);border:1px solid var(--line);border-radius:14px;padding:3px 12px;font-size:12.5px;z-index:8;opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none;max-width:96%;overflow:hidden;text-overflow:ellipsis}.toast.on{opacity:1}
.bot{position:absolute;bottom:0;left:0;right:0;background:rgba(12,16,27,.88);border-top:1px solid var(--line);z-index:5;padding:4px 8px calc(8px + env(safe-area-inset-bottom))}
.det{min-height:58px;font-size:12.5px}.det .t{font-weight:700;color:var(--gold)}.det .g2{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
.det .ln{display:flex;justify-content:space-between;gap:6px}.det .up{color:var(--green)}.det .dn{color:var(--red)}.det .nt{color:var(--dim);font-size:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.go{background:#2d6b3f;border:1px solid #58b073;border-radius:10px;padding:9px 0;text-align:center;font-weight:700;font-size:15px}.go:disabled{background:#26302b;border-color:#38453d;color:#889;opacity:.7}
.endb{background:#6a3a2a;border:1px solid #b5704f;border-radius:10px;padding:4px;text-align:center;font-weight:700;font-size:14px;line-height:1.25}.endb small{display:block;font-weight:400;font-size:11px;color:#ffd9c4}
.ov{position:absolute;inset:0;background:rgba(5,7,12,.86);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
.box{background:#11172a;border:2px solid var(--gold);border-radius:12px;padding:12px 14px;width:100%;max-width:420px}.box h3{margin:0 0 6px;color:var(--gold);font-size:17px}
.box .row{display:flex;justify-content:space-between;font-size:14px;padding:1px 0}.box .nt{font-size:12px;color:var(--dim);margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.two button{background:#222b42;border:1px solid #3a4666;border-radius:9px;padding:9px 6px;font-weight:700}.two small{display:block;font-weight:400;font-size:11px;color:var(--dim)}
@media (orientation:landscape) and (min-width:760px){.app{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"stage top" "stage ." "stage bot"}.stage{position:relative;grid-area:stage;align-items:center;justify-content:center;flex-direction:row}.top{position:relative;grid-area:top;background:var(--pn);border-left:1px solid var(--line)}.bot{position:relative;grid-area:bot;background:var(--pn);border-left:1px solid var(--line)}}
</style></head><body>
<div class="app" id="app"></div>
<script>
(function () {
  'use strict';
  var CAP = { farm: 3, wall: 3, net: 2, tavern: 1, troops: 12 };
  var SCHED = [
    { w: 3, E: 13, name: '野盗の襲撃' }, { w: 5, E: 17, name: '謀反軍の偵察隊' }, { w: 7, E: 21, name: '謀反軍の先遣隊' },
    { w: 9, E: 25, name: '将軍の副官の軍' }, { w: 11, E: 29, name: '謀反軍の本隊' }, { w: 12, E: 34, name: '将軍の侵攻', boss: true }
  ];
  var ALLY = { mina: { n: 'ミナ', r: '捕縛役', x: '4%' }, garou: { n: 'ガロウ', r: '火力役', x: '31%' }, sera: { n: 'セラ', r: '内政役', x: '66%' } };
  var ROOM = null, G, SEL = null, TAB = 'build', PREV = null, root = document.getElementById('app'), toastT = 0, toastS = '';
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function apOf(m) { return m < 30 ? 2 : (m >= 80 ? 4 : 3); }
  function clone(s) { return JSON.parse(JSON.stringify(s)); }
  function nextRaid(s) { return SCHED.filter(function (r) { return r.w >= s.week; })[0]; }

  /* ---------- 指標（全部ここから計算）。プレビューも同じ式 ---------- */
  function garouB(s) { return s.bond.garou >= 3 ? 7 : s.bond.garou >= 2 ? 4 : 0; }
  function D(s) { return s.troops * 1.5 + s.wall * 3 + garouB(s) + 2; }
  function netEff(s) { return s.net * (s.bond.mina >= 2 ? 1.5 : 1); }
  function handP(s, E) { var m0 = D(s) - E; return clamp(0.4 + 0.12 * netEff(s) + clamp(m0 / 40, -0.2, 0.2) + (s.bond.mina >= 3 ? 0.08 : 0), 0.12, 0.92); }
  function inc(s) { return 4 + (2 + (s.bond.sera >= 2 ? 1 : 0)) * s.farm - Math.floor(s.troops / 2); }
  function mdl(s) { return -2 + 3 * s.tavern; }
  function Eof(s) { var r = nextRaid(s); return r ? (s.scouted[r.w] ? r.E : r.E) : 0; }
  function M(s) { var r = nextRaid(s), E = r ? r.E : 0; return { sup: s.sup, morale: Math.round(s.morale), troops: s.troops, hp: s.hp, D: D(s), inc: inc(s), md: mdl(s), p: handP(s, E), apn: apOf(clamp(s.morale + mdl(s), 0, 100)), ap: s.ap }; }

  /* ---------- 行動の定義：apply(s) が状態を書き換える。実行もプレビューも同じ関数 ---------- */
  var ACTS = {
    farm:  { tab: 'build', t: '畑', cost: 4, can: function (s) { return s.farm < CAP.farm; }, ap: function (s) { s.farm++; }, d: '毎週の物資+2' },
    wall:  { tab: 'build', t: '城壁', cost: 5, can: function (s) { return s.wall < CAP.wall; }, ap: function (s) { s.wall++; }, d: '防衛力+3' },
    net:   { tab: 'build', t: '捕縛網', cost: 4, can: function (s) { return s.net < CAP.net; }, ap: function (s) { s.net++; }, d: '自分で戦う成功率+12%' },
    tavern:{ tab: 'build', t: '酒場', cost: 4, can: function (s) { return s.tavern < CAP.tavern; }, ap: function (s) { s.tavern++; }, d: '毎週の民心+3' },
    troops:{ tab: 'folk', t: '兵を募る', cost: 3, can: function (s) { return s.troops < CAP.troops; }, ap: function (s) { s.troops = Math.min(CAP.troops, s.troops + 2); }, d: '兵力+2。維持費が増える' },
    levy:  { tab: 'folk', t: '徴発', cost: 0, can: function () { return true; }, ap: function (s) { s.sup += 5; s.morale = Math.max(0, s.morale - 8); }, d: '物資+5 民心-8' },
    feast: { tab: 'folk', t: '炊き出し', cost: 3, can: function () { return true; }, ap: function (s) { s.morale = Math.min(100, s.morale + (s.bond.sera >= 3 ? 15 : 10)); }, d: '民心+10' },
    mina:  { tab: 'ally', t: 'ミナと過ごす', cost: 0, can: function (s) { return s.bond.mina < 3; }, ap: function (s) { s.bond.mina++; }, d: '絆+1', note: function (s) { return s.bond.mina < 2 ? '絆2：捕縛網の効果1.5倍' : '絆3：自分で戦う成功率+8%'; } },
    garou: { tab: 'ally', t: 'ガロウと過ごす', cost: 0, can: function (s) { return s.bond.garou < 3; }, ap: function (s) { s.bond.garou++; }, d: '絆+1', note: function (s) { return s.bond.garou < 2 ? '絆2：防衛力+4' : '絆3：防衛力+7'; } },
    sera:  { tab: 'ally', t: 'セラと過ごす', cost: 0, can: function (s) { return s.bond.sera < 3; }, ap: function (s) { s.bond.sera++; }, d: '絆+1', note: function (s) { return s.bond.sera < 2 ? '絆2：畑の産出+1ずつ' : '絆3：炊き出しの民心+15'; } },
    scout: { tab: 'war', t: '偵察', cost: 0, can: function (s) { var r = nextRaid(s); return !!r && !s.scouted[r.w]; }, ap: function (s) { var r = nextRaid(s); s.scouted[r.w] = true; }, d: '次の襲撃の規模が確定', note: function (s) { var r = nextRaid(s); return r ? '第' + r.w + '週の敵：約' + Math.round(r.E * 0.75) + '〜' + Math.round(r.E * 1.25) + ' → ' + r.E : ''; } },
    sortie:{ tab: 'war', t: '出撃', cost: 0, can: function (s) { return s.troops >= 2; }, ap: function () {}, d: '敵の前哨（規模14）を攻める', note: function () { return '勝てば物資+8。任せるか自分で戦うか選ぶ'; } }
  };
  var TABS = [['build', '建てる'], ['folk', '民と兵'], ['ally', '仲間'], ['war', '戦い']];
  function canDo(s, id) { var a = ACTS[id]; return s.ap >= 1 && s.sup >= a.cost && a.can(s); }
  function applyAct(s, id) { var a = ACTS[id]; s.ap--; s.sup -= a.cost; a.ap(s); }

  /* ---------- 状態 ---------- */
  function newGame() { G = { week: 1, ap: 3, sup: 10, morale: 60, troops: 4, hp: 3, farm: 0, wall: 0, net: 0, tavern: 0, scouted: {}, bond: { mina: 0, garou: 0, sera: 0 }, over: null, why: '', modal: null, tired: false, st: { auto: 0, hand: 0, sortie: 0 } }; SEL = null; ROOM = null; TAB = 'build'; PREV = null; render(); }
  function toast(s) { toastS = s; toastT = Date.now(); render(true); setTimeout(function () { if (Date.now() - toastT >= 1700) { var t = document.querySelector('.toast'); if (t) t.classList.remove('on'); } }, 1800); }

  /* ---------- 戦闘（「自分で戦う」は仮） ---------- */
  function resolve(mode) {
    var Md = G.modal, E = Md.E, m = D(G) - E * rnd(0.9, 1.1), at = m >= 4 ? 0 : m >= 0 ? 1 : m >= -4 ? 2 : 3, ok, tier, s = Md.name + (mode === 'auto' ? '（任せた）' : '（自分で戦った）') + '：';
    if (mode === 'auto') { tier = at; ok = tier === 0; G.st.auto++; } else { ok = Math.random() < handP(G, E); tier = ok ? 0 : clamp(at + 1, 1, 3); G.st.hand++; if (Md.kind === 'sortie') G.ap = Math.max(0, G.ap - 1); else G.tired = true; }
    G.modal = null;
    if (Md.boss) { G.over = ok ? 'win' : 'lose'; G.why = ok ? '将軍の侵攻を退けた' : '将軍に拠点を落とされた'; render(); return; }
    if (Md.kind === 'sortie') {
      G.st.sortie++;
      if (ok) { var g = mode === 'hand' ? 10 : 8; G.sup += g; G.morale += 3; s += '勝利 物資+' + g; } else if (tier === 1) { G.morale -= 5; G.sup -= 2; s += '苦戦 民心-5 物資-2'; } else if (tier === 2) { G.troops -= 1; G.morale -= 8; s += '敗退 兵力-1 民心-8'; } else { G.troops -= 2; G.morale -= 12; s += '大敗 兵力-2 民心-12'; }
    } else if (tier === 0) { if (mode === 'hand') { G.sup += 4; G.morale += 5; s += '完勝 物資+4 民心+5'; } else s += '被害なし'; }
    else if (tier === 1) { G.sup -= 3; G.morale -= 5; s += '小被害 物資-3 民心-5'; }
    else if (tier === 2) { G.sup -= 5; G.morale -= 12; G.troops -= 1; s += '中被害 物資-5 民心-12 兵力-1'; }
    else { G.hp -= 1; G.morale -= 15; G.troops -= 2; G.sup -= 5; s += '大被害 耐久-1 民心-15 兵力-2 物資-5'; }
    G.sup = Math.max(0, G.sup); G.troops = Math.max(0, G.troops); G.morale = clamp(G.morale, 0, 100);
    if (Md.kind === 'raid') afterWeek(); else { lose(); render(); } toast(s);
  }
  function lose() { if (G.over) return; if (G.hp <= 0) { G.over = 'lose'; G.why = '拠点が陥落した'; } else if (G.morale <= 0) { G.over = 'lose'; G.why = '民心が尽き、反乱が起きた'; } }
  function endWeek() {
    if (G.over || G.modal) return; var i = inc(G), d = mdl(G);
    G.sup = Math.max(0, G.sup + i); G.morale = clamp(G.morale + d, 0, 100); toast('週末：物資' + (i >= 0 ? '+' : '') + i + ' 民心' + (d >= 0 ? '+' : '') + d);
    var r = SCHED.filter(function (x) { return x.w === G.week; })[0]; SEL = null;
    if (r) { G.modal = { kind: 'raid', E: r.E, name: r.name, boss: !!r.boss, w: r.w }; render(); } else afterWeek();
  }
  function afterWeek() { lose(); if (!G.over) { G.week++; if (G.week > 12) { G.over = 'win'; G.why = '12週を生き延びた'; } else { G.ap = Math.max(1, apOf(G.morale) - (G.tired ? 1 : 0)); G.tired = false; } } render(); }
  function exec() {
    if (!SEL || G.over || G.modal || !canDo(G, SEL)) return; var id = SEL, a = ACTS[id];
    applyAct(G, id); toast(a.t + 'を実行');
    if (id === 'sortie') G.modal = { kind: 'sortie', E: 14, name: '敵の前哨', boss: false };
    if (!canDo(G, id)) SEL = null; render();
  }

  /* ---------- 部屋（画像座標 941x1672）と行動の対応 ---------- */
  var VX = 40, VW = 800, VH = 1672;
  var ROOMS = {
    farm:     { n: '畑',     r: [140, 350, 440, 488], fl: 485,  acts: ['farm'] },
    tower:    { n: '物見台', r: [545, 205, 775, 488], fl: 485,  acts: ['scout'] },
    quarters: { n: '寝室',   r: [100, 525, 445, 735], fl: 722,  acts: ['sera', 'feast'] },
    war:      { n: '作戦室', r: [475, 525, 785, 735], fl: 722,  acts: ['sortie'] },
    tavern:   { n: '酒場',   r: [105, 785, 445, 1000], fl: 990, acts: ['tavern'] },
    work:     { n: '工房',   r: [480, 785, 805, 1000], fl: 990, acts: ['net', 'mina'] },
    court:    { n: '中庭',   r: [190, 1050, 480, 1325], fl: 1315, acts: ['troops', 'garou'] },
    wall:     { n: '城壁',   r: [480, 1050, 815, 1325], fl: 1315, acts: ['wall', 'levy'] }
  };
  var ROOM_OF = {}; Object.keys(ROOMS).forEach(function (k) { ROOMS[k].acts.forEach(function (a) { ROOM_OF[a] = k; }); });
  var SPR = { sera: { room: 'quarters', x: 335, h: 150, w: 68 }, mina: { room: 'work', x: 610, h: 150, w: 66 }, garou: { room: 'court', x: 425, h: 205, w: 135 } };
    function px(x) { return ((x - VX) / VW * 100).toFixed(3) + '%'; }
  function py(y) { return (y / VH * 100).toFixed(3) + '%'; }
  function pw(w) { return (w / VW * 100).toFixed(3) + '%'; }
  function ph(h) { return (h / VH * 100).toFixed(3) + '%'; }
  function pips(n, m) { return '●'.repeat(n) + '○'.repeat(m - n); }

  function figSoldier(x, y, k) { var s = k; return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')"><line x1="14" y1="-4" x2="14" y2="-78" stroke="#c9d3e8" stroke-width="3"/><path d="M14 -86 l-5 10 h10z" fill="#e9eef8"/><ellipse cx="0" cy="-58" rx="9" ry="10" fill="#9fb4d6" stroke="#1b2438" stroke-width="2"/><rect x="-11" y="-48" width="22" height="40" rx="6" fill="#4b6fb0" stroke="#1b2438" stroke-width="2"/><rect x="-10" y="-9" width="8" height="12" fill="#2b3550"/><rect x="2" y="-9" width="8" height="12" fill="#2b3550"/></g>'; }
  function figEnemy(x, y, k, ghost) { return '<g transform="translate(' + x + ',' + y + ') scale(' + k + ')" opacity="' + (ghost ? 0.35 : 0.95) + '"><ellipse cx="0" cy="-55" rx="10" ry="11" fill="#14090c" stroke="' + (ghost ? '#ff9f9f' : '#401015') + '" stroke-width="2"' + (ghost ? ' stroke-dasharray="4 3"' : '') + '/><circle cx="-4" cy="-56" r="2.2" fill="#ff3b3b"/><circle cx="4" cy="-56" r="2.2" fill="#ff3b3b"/><path d="M-13 -44 h26 l4 38 h-34z" fill="#14090c" stroke="' + (ghost ? '#ff9f9f' : '#401015') + '" stroke-width="2"' + (ghost ? ' stroke-dasharray="4 3"' : '') + '/><line x1="-18" y1="-6" x2="-18" y2="-70" stroke="#2a1a1a" stroke-width="3"/><circle cx="-18" cy="-76" r="6" fill="#ff9a3b" opacity=".9"/></g>'; }

  function build(s, pv) { /* 建設状態に応じた暗さ */ return s; }
  function dimOf(k, s) {
    var m = { farm: ['farm', CAP.farm], tavern: ['tavern', CAP.tavern], work: ['net', CAP.net], wall: ['wall', CAP.wall] }[k]; if (!m) return 0;
    return 0.66 - 0.5 * (s[m[0]] / m[1]);
  }
  function roomTag(k, s) {
    var R = ROOMS[k], t = R.n;
    if (k === 'farm') t += ' <span class="pp">' + pips(s.farm, CAP.farm) + '</span>';
