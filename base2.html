<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>通常パート試作2（縦・1画面）</title>
<style>
:root{--bg:#0b0e16;--pn:rgba(13,17,28,.82);--line:#2b3347;--tx:#e8edf8;--dim:#98a4c0;--gold:#ffd27a;--red:#ff7f7f;--blue:#7ec0ff;--green:#7fe29a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
/* 上：週と資源 */
.top{background:var(--pn);border-bottom:1px solid var(--line);padding:6px 10px 6px}
.weeks{display:flex;gap:3px;align-items:center}
.wk{flex:1;height:18px;border-radius:4px;background:#1a2133;font-size:10px;text-align:center;line-height:18px;color:var(--dim);position:relative}
.wk.now{background:var(--gold);color:#222;font-weight:700}.wk.past{opacity:.35}.wk.raid{box-shadow:inset 0 -3px 0 var(--red)}.wk.boss{box-shadow:inset 0 -3px 0 #ff3b3b;color:var(--red)}
.cd{font-size:11.5px;color:var(--dim);margin:3px 0 5px}.cd b{color:var(--red)}
.res{display:grid;grid-template-columns:1.1fr 1.5fr 1fr 1fr;gap:6px}
.blk{background:#141b2c;border:1px solid var(--line);border-radius:8px;padding:4px 7px;position:relative;min-height:46px}
.blk .l{font-size:10.5px;color:var(--dim)}.blk .v{font-size:19px;font-weight:700;line-height:1.15}.blk .s{font-size:10.5px;color:var(--dim)}
.chip{position:absolute;right:5px;top:3px;font-size:12px;font-weight:700;padding:0 5px;border-radius:9px}
.chip.up{background:rgba(127,226,154,.2);color:var(--green)}.chip.dn{background:rgba(255,127,127,.22);color:var(--red)}
.mbar{height:7px;background:#000;border-radius:4px;position:relative;margin-top:3px;overflow:hidden}.mbar i{position:absolute;left:0;top:0;bottom:0}.mbar u{position:absolute;top:0;bottom:0;width:1px;background:#fff6}
.pulse{animation:pl .5s}@keyframes pl{0%{background:#4a5b8a}100%{background:#141b2c}}
/* 戦力ゲージ */
.gauge{background:var(--pn);border-bottom:1px solid var(--line);padding:6px 10px 8px}
.gh{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}.gh b{color:var(--gold)}
.gb{height:22px;background:#0a0d16;border-radius:6px;position:relative;overflow:hidden;border:1px solid var(--line)}
.gb .d{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2b6fc2,#5aa8ff)}
.gb .g{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#9fe0ff88 0 4px,#5aa8ff55 4px 8px)}
.gb .gm{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#ff7f7f66 0 4px,#ff7f7f33 4px 8px)}
.gb .e{position:absolute;top:0;bottom:0;background:rgba(255,100,100,.38);border-left:2px solid var(--red);border-right:2px solid var(--red)}
.gt{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:2px}
.pb{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px}.pb .gb{flex:1;height:12px}.pb .gb .d{background:linear-gradient(90deg,#c27a2b,#ffd27a)}
/* 場面 */
.scene{flex:1;min-height:150px;position:relative;background:#111 url(stage/camp_bg.jpg) center bottom/cover;overflow:hidden}
.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(8,10,18,.25),rgba(8,10,18,.1) 50%,rgba(8,10,18,.55))}
.fac{position:absolute;left:8px;top:8px;display:flex;gap:6px;z-index:2}
.fc{background:var(--pn);border:1px solid var(--line);border-radius:9px;padding:3px 7px;text-align:center;min-width:44px}.fc.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.fc b{display:block;font-size:14px}.fc span{font-size:10.5px;color:var(--dim)}
.mem{position:absolute;bottom:0;height:92%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;z-index:1}
.mem img{height:calc(100% - 34px);max-width:100%;object-fit:contain;filter:drop-shadow(0 4px 8px #000a);pointer-events:none}
.mem .nm{margin-top:2px;background:var(--pn);border:1px solid var(--line);border-radius:9px;padding:1px 8px;font-size:11.5px;white-space:nowrap}.mem.sel .nm{border-color:var(--gold)}
.mem .pp{color:var(--gold);letter-spacing:1px;font-size:11px}
.toast{position:absolute;left:50%;top:44px;transform:translateX(-50%);background:rgba(0,0,0,.72);border:1px solid var(--line);border-radius:14px;padding:3px 12px;font-size:12.5px;z-index:3;opacity:0;transition:opacity .25s;white-space:nowrap}.toast.on{opacity:1}
/* 下：操作 */
.tray{background:var(--pn);border-top:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{padding:8px 0;text-align:center;font-weight:700;color:var(--dim);border-bottom:2px solid transparent;font-size:13.5px}.tab.on{color:var(--gold);border-color:var(--gold)}
.cards{display:flex;gap:6px;padding:8px 8px 4px;overflow-x:auto}
.cd2{flex:0 0 auto;min-width:92px;max-width:130px;background:#141b2c;border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:left}.cd2.sel{border-color:var(--gold);background:#1d2742}.cd2:disabled{opacity:.35}
.cd2 b{display:block;font-size:13.5px}.cd2 small{display:block;color:var(--dim);font-size:11px;line-height:1.25}
.det{padding:2px 10px 4px;min-height:62px;font-size:12px}.det .t{font-weight:700;color:var(--gold);margin-bottom:1px}.det .ln{display:flex;justify-content:space-between;gap:8px}.det .up{color:var(--green)}.det .dn{color:var(--red)}.det .nt{color:var(--dim)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px 8px 8px}
.go{background:#2d6b3f;border:1px solid #58b073;border-radius:10px;padding:10px 0;text-align:center;font-weight:700;font-size:15px}.go:disabled{background:#26302b;border-color:#38453d;color:#889;opacity:.7}
.endb{background:#6a3a2a;border:1px solid #b5704f;border-radius:10px;padding:6px 4px;text-align:center;font-weight:700;font-size:13.5px;line-height:1.25}.endb small{display:block;font-weight:400;font-size:10.5px;color:#ffd9c4}
/* ダイアログ */
.ov{position:absolute;inset:0;background:rgba(5,7,12,.84);display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}
.box{background:#11172a;border:2px solid var(--gold);border-radius:12px;padding:12px 14px;width:100%;max-width:420px}.box h3{margin:0 0 6px;color:var(--gold);font-size:17px}
.box .row{display:flex;justify-content:space-between;font-size:13.5px;padding:1px 0}.box .nt{font-size:12px;color:var(--dim);margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.two button{background:#222b42;border:1px solid #3a4666;border-radius:9px;padding:9px 6px;font-weight:700}.two small{display:block;font-weight:400;font-size:11px;color:var(--dim)}
@media (orientation:landscape) and (min-width:700px){.app{max-width:none;display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:auto auto 1fr}.top{grid-column:1/3}.gauge{grid-column:1/2}.scene{grid-column:1/2;grid-row:3}.tray{grid-column:2/3;grid-row:2/4;display:flex;flex-direction:column;border-left:1px solid var(--line)}.cards{flex-wrap:wrap}.det{flex:1}}
</style></head><body>
<div class="app" id="app"></div>
<script>
(function () {
  'use strict';
  var CAP = { farm: 3, wall: 3, net: 2, tavern: 1, troops: 12 };
  var SCHED = [
    { w: 3, E: 13, name: '野盗の襲撃' }, { w: 5, E: 17, name: '謀反軍の偵察隊' }, { w: 7, E: 21, name: '謀反軍の先遣隊' },
    { w: 9, E: 25, name: '将軍の副官の軍' }, { w: 11, E: 29, name: '謀反軍の本隊' }, { w: 12, E: 34, name: '将軍の侵攻', boss: true }
  ];
  var ALLY = { mina: { n: 'ミナ', r: '捕縛役', x: '4%' }, garou: { n: 'ガロウ', r: '火力役', x: '31%' }, sera: { n: 'セラ', r: '内政役', x: '66%' } };
  var G, SEL = null, TAB = 'build', PREV = null, root = document.getElementById('app'), toastT = 0, toastS = '';
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function apOf(m) { return m < 30 ? 2 : (m >= 80 ? 4 : 3); }
  function clone(s) { return JSON.parse(JSON.stringify(s)); }
  function nextRaid(s) { return SCHED.filter(function (r) { return r.w >= s.week; })[0]; }

  /* ---------- 指標（全部ここから計算）。プレビューも同じ式 ---------- */
  function garouB(s) { return s.bond.garou >= 3 ? 7 : s.bond.garou >= 2 ? 4 : 0; }
  function D(s) { return s.troops * 1.5 + s.wall * 3 + garouB(s) + 2; }
  function netEff(s) { return s.net * (s.bond.mina >= 2 ? 1.5 : 1); }
  function handP(s, E) { var m0 = D(s) - E; return clamp(0.4 + 0.12 * netEff(s) + clamp(m0 / 40, -0.2, 0.2) + (s.bond.mina >= 3 ? 0.08 : 0), 0.12, 0.92); }
  function inc(s) { return 4 + (2 + (s.bond.sera >= 2 ? 1 : 0)) * s.farm - Math.floor(s.troops / 2); }
  function mdl(s) { return -2 + 3 * s.tavern; }
  function Eof(s) { var r = nextRaid(s); return r ? (s.scouted[r.w] ? r.E : r.E) : 0; }
  function M(s) { var r = nextRaid(s), E = r ? r.E : 0; return { sup: s.sup, morale: Math.round(s.morale), troops: s.troops, hp: s.hp, D: D(s), inc: inc(s), md: mdl(s), p: handP(s, E), apn: apOf(clamp(s.morale + mdl(s), 0, 100)), ap: s.ap }; }

  /* ---------- 行動の定義：apply(s) が状態を書き換える。実行もプレビューも同じ関数 ---------- */
  var ACTS = {
    farm:  { tab: 'build', t: '畑', cost: 4, can: function (s) { return s.farm < CAP.farm; }, ap: function (s) { s.farm++; }, d: '毎週の物資+2' },
    wall:  { tab: 'build', t: '城壁', cost: 5, can: function (s) { return s.wall < CAP.wall; }, ap: function (s) { s.wall++; }, d: '防衛力+3' },
    net:   { tab: 'build', t: '捕縛網', cost: 4, can: function (s) { return s.net < CAP.net; }, ap: function (s) { s.net++; }, d: '自分で戦う成功率+12%' },
    tavern:{ tab: 'build', t: '酒場', cost: 4, can: function (s) { return s.tavern < CAP.tavern; }, ap: function (s) { s.tavern++; }, d: '毎週の民心+3' },
    troops:{ tab: 'folk', t: '兵を募る', cost: 3, can: function (s) { return s.troops < CAP.troops; }, ap: function (s) { s.troops = Math.min(CAP.troops, s.troops + 2); }, d: '兵力+2。維持費が増える' },
    levy:  { tab: 'folk', t: '徴発', cost: 0, can: function () { return true; }, ap: function (s) { s.sup += 5; s.morale = Math.max(0, s.morale - 8); }, d: '物資+5 民心-8' },
    feast: { tab: 'folk', t: '炊き出し', cost: 3, can: function () { return true; }, ap: function (s) { s.morale = Math.min(100, s.morale + (s.bond.sera >= 3 ? 15 : 10)); }, d: '民心+10' },
    mina:  { tab: 'ally', t: 'ミナと過ごす', cost: 0, can: function (s) { return s.bond.mina < 3; }, ap: function (s) { s.bond.mina++; }, d: '絆+1', note: function (s) { return s.bond.mina < 2 ? '絆2：捕縛網の効果1.5倍' : '絆3：自分で戦う成功率+8%'; } },
    garou: { tab: 'ally', t: 'ガロウと過ごす', cost: 0, can: function (s) { return s.bond.garou < 3; }, ap: function (s) { s.bond.garou++; }, d: '絆+1', note: function (s) { return s.bond.garou < 2 ? '絆2：防衛力+4' : '絆3：防衛力+7'; } },
    sera:  { tab: 'ally', t: 'セラと過ごす', cost: 0, can: function (s) { return s.bond.sera < 3; }, ap: function (s) { s.bond.sera++; }, d: '絆+1', note: function (s) { return s.bond.sera < 2 ? '絆2：畑の産出+1ずつ' : '絆3：炊き出しの民心+15'; } },
    scout: { tab: 'war', t: '偵察', cost: 0, can: function (s) { var r = nextRaid(s); return !!r && !s.scouted[r.w]; }, ap: function (s) { var r = nextRaid(s); s.scouted[r.w] = true; }, d: '次の襲撃の規模が確定', note: function (s) { var r = nextRaid(s); return r ? '第' + r.w + '週の敵：約' + Math.round(r.E * 0.75) + '〜' + Math.round(r.E * 1.25) + ' → ' + r.E : ''; } },
    sortie:{ tab: 'war', t: '出撃', cost: 0, can: function (s) { return s.troops >= 2; }, ap: function () {}, d: '敵の前哨（規模14）を攻める', note: function () { return '勝てば物資+8。任せるか自分で戦うか選ぶ'; } }
  };
  var TABS = [['build', '建てる'], ['folk', '民と兵'], ['ally', '仲間'], ['war', '戦い']];
  function canDo(s, id) { var a = ACTS[id]; return s.ap >= 1 && s.sup >= a.cost && a.can(s); }
  function applyAct(s, id) { var a = ACTS[id]; s.ap--; s.sup -= a.cost; a.ap(s); }

  /* ---------- 状態 ---------- */
  function newGame() { G = { week: 1, ap: 3, sup: 10, morale: 60, troops: 4, hp: 3, farm: 0, wall: 0, net: 0, tavern: 0, scouted: {}, bond: { mina: 0, garou: 0, sera: 0 }, over: null, why: '', modal: null, tired: false, st: { auto: 0, hand: 0, sortie: 0 } }; SEL = null; TAB = 'build'; PREV = null; render(); }
  function toast(s) { toastS = s; toastT = Date.now(); render(true); setTimeout(function () { if (Date.now() - toastT >= 1700) { var t = document.querySelector('.toast'); if (t) t.classList.remove('on'); } }, 1800); }

  /* ---------- 戦闘（「自分で戦う」は仮） ---------- */
  function resolve(mode) {
    var Md = G.modal, E = Md.E, m = D(G) - E * rnd(0.9, 1.1), at = m >= 4 ? 0 : m >= 0 ? 1 : m >= -4 ? 2 : 3, ok, tier, s = Md.name + (mode === 'auto' ? '（任せた）' : '（自分で戦った）') + '：';
    if (mode === 'auto') { tier = at; ok = tier === 0; G.st.auto++; } else { ok = Math.random() < handP(G, E); tier = ok ? 0 : clamp(at + 1, 1, 3); G.st.hand++; if (Md.kind === 'sortie') G.ap = Math.max(0, G.ap - 1); else G.tired = true; }
    G.modal = null;
    if (Md.boss) { G.over = ok ? 'win' : 'lose'; G.why = ok ? '将軍の侵攻を退けた' : '将軍に拠点を落とされた'; render(); return; }
    if (Md.kind === 'sortie') {
      G.st.sortie++;
      if (ok) { var g = mode === 'hand' ? 10 : 8; G.sup += g; G.morale += 3; s += '勝利 物資+' + g; } else if (tier === 1) { G.morale -= 5; G.sup -= 2; s += '苦戦 民心-5 物資-2'; } else if (tier === 2) { G.troops -= 1; G.morale -= 8; s += '敗退 兵力-1 民心-8'; } else { G.troops -= 2; G.morale -= 12; s += '大敗 兵力-2 民心-12'; }
    } else if (tier === 0) { if (mode === 'hand') { G.sup += 4; G.morale += 5; s += '完勝 物資+4 民心+5'; } else s += '被害なし'; }
    else if (tier === 1) { G.sup -= 3; G.morale -= 5; s += '小被害 物資-3 民心-5'; }
    else if (tier === 2) { G.sup -= 5; G.morale -= 12; G.troops -= 1; s += '中被害 物資-5 民心-12 兵力-1'; }
    else { G.hp -= 1; G.morale -= 15; G.troops -= 2; G.sup -= 5; s += '大被害 耐久-1 民心-15 兵力-2 物資-5'; }
    G.sup = Math.max(0, G.sup); G.troops = Math.max(0, G.troops); G.morale = clamp(G.morale, 0, 100);
    if (Md.kind === 'raid') afterWeek(); else { lose(); render(); } toast(s);
  }
  function lose() { if (G.over) return; if (G.hp <= 0) { G.over = 'lose'; G.why = '拠点が陥落した'; } else if (G.morale <= 0) { G.over = 'lose'; G.why = '民心が尽き、反乱が起きた'; } }
  function endWeek() {
    if (G.over || G.modal) return; var i = inc(G), d = mdl(G);
    G.sup = Math.max(0, G.sup + i); G.morale = clamp(G.morale + d, 0, 100); toast('週末：物資' + (i >= 0 ? '+' : '') + i + ' 民心' + (d >= 0 ? '+' : '') + d);
    var r = SCHED.filter(function (x) { return x.w === G.week; })[0]; SEL = null;
    if (r) { G.modal = { kind: 'raid', E: r.E, name: r.name, boss: !!r.boss, w: r.w }; render(); } else afterWeek();
  }
  function afterWeek() { lose(); if (!G.over) { G.week++; if (G.week > 12) { G.over = 'win'; G.why = '12週を生き延びた'; } else { G.ap = Math.max(1, apOf(G.morale) - (G.tired ? 1 : 0)); G.tired = false; } } render(); }
  function exec() {
    if (!SEL || G.over || G.modal || !canDo(G, SEL)) return; var id = SEL, a = ACTS[id];
    applyAct(G, id); toast(a.t + 'を実行');
    if (id === 'sortie') G.modal = { kind: 'sortie', E: 14, name: '敵の前哨', boss: false };
    if (!canDo(G, id)) SEL = null; render();
  }

  /* ---------- 描画 ---------- */
  function sg(n) { return (n > 0 ? '+' : '') + n; }
  function f1(n) { return (Math.round(n * 10) / 10).toFixed(1); }
  function render(toastOnly) {
    if (toastOnly) { var t = document.querySelector('.toast'); if (t) { t.textContent = toastS; t.classList.add('on'); return; } }
    var cur = M(G), pv = null, pm = null;
    if (SEL && !G.over && !G.modal && canDo(G, SEL)) { var s2 = clone(G); applyAct(s2, SEL); pv = s2; pm = M(s2); }
    var h = '', r = nextRaid(G), wl = r ? r.w - G.week : 0;
    // 上
    h += '<div class="top"><div class="weeks">';
    for (var w = 1; w <= 12; w++) { var rr = SCHED.filter(function (x) { return x.w === w; })[0]; h += '<div class="wk' + (w === G.week ? ' now' : w < G.week ? ' past' : '') + (rr ? (rr.boss ? ' boss' : ' raid') : '') + '">' + (rr && rr.boss ? '★' : w) + '</div>'; }
    h += '</div><div class="cd">' + (r ? (wl === 0 ? '<b>今週の末に襲撃：' + r.name + '</b>' : '次の襲撃：<b>' + r.name + '</b>（あと' + wl + '週）') : '襲撃はもうない') + '　行動点 <b style="color:var(--gold)">' + '●'.repeat(G.ap) + '○'.repeat(Math.max(0, apOf(G.morale) - G.ap)) + '</b>' + (pv ? '<span style="color:var(--dim)"> → 実行後 ' + '●'.repeat(Math.max(0, pv.ap)) + '</span>' : '') + '</div>';
    h += '<div class="res">';
    function chip(c, p, unit) { var d = p - c; return d ? '<span class="chip ' + (d > 0 ? 'up' : 'dn') + '">' + sg(Math.round(d * 10) / 10) + (unit || '') + '</span>' : ''; }
    var pul = function (k) { return PREV && PREV[k] !== cur[k] ? ' pulse' : ''; };
    h += '<div class="blk' + pul('sup') + '"><div class="l">物資</div><div class="v">' + cur.sup + '</div><div class="s">毎週 ' + sg(cur.inc) + (pm && pm.inc !== cur.inc ? ' → ' + sg(pm.inc) : '') + '</div>' + (pm ? chip(cur.sup, pm.sup) : '') + '</div>';
    var mc = G.morale < 30 ? 'var(--red)' : G.morale >= 80 ? 'var(--gold)' : 'var(--green)';
    h += '<div class="blk' + pul('morale') + '"><div class="l">民心 <span style="font-size:9.5px">(30↓行動点- 80↑+)</span></div><div class="v">' + cur.morale + '</div><div class="mbar"><i style="width:' + clamp(G.morale, 0, 100) + '%;background:' + mc + '"></i>' + (pm ? '<i style="left:' + Math.min(cur.morale, pm.morale) + '%;width:' + Math.abs(pm.morale - cur.morale) + '%;background:' + (pm.morale >= cur.morale ? '#9fffb5aa' : '#ff7f7faa') + '"></i>' : '') + '<u style="left:30%"></u><u style="left:80%"></u></div><div class="s">毎週 ' + sg(cur.md) + (pm && pm.md !== cur.md ? ' → ' + sg(pm.md) : '') + '</div>' + (pm ? chip(cur.morale, pm.morale) : '') + '</div>';
    h += '<div class="blk' + pul('troops') + '"><div class="l">兵力</div><div class="v">' + cur.troops + '</div><div class="s">維持費 ' + Math.floor(G.troops / 2) + '</div>' + (pm ? chip(cur.troops, pm.troops) : '') + '</div>';
